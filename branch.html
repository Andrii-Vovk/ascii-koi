<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ascii winter branch</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1122; overflow: hidden; }
  canvas {
    display: block; width: 100vw; height: 100vh;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
</style>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<script>
"use strict";

// ---------- small helpers ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);

function hash(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1274126177)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function noise2(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const u = smooth(x - xi), v = smooth(y - yi);
  return lerp(
    lerp(hash(xi, yi, s), hash(xi + 1, yi, s), u),
    lerp(hash(xi, yi + 1, s), hash(xi + 1, yi + 1, s), u),
    v
  );
}
const noise1 = (x, s) => noise2(x, 0, s);
function angleDiff(a, b) {
  let d = (a - b) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}
// Seeded random numbers, so the same seed always grows the same branch.
function mulberry(a) {
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pack = (r, g, b) => (clamp(r | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(b | 0, 0, 255);
const cssCache = new Map();
function css(c) {
  c &= 0xf8f8f8;
  let v = cssCache.get(c);
  if (v === undefined) cssCache.set(c, (v = `rgb(${c >>> 16},${(c >>> 8) & 255},${c & 255})`));
  return v;
}
// A line drawn at this angle looks most like which character?
function dirGlyph(a) {
  a = ((a % Math.PI) + Math.PI) % Math.PI;
  if (a < Math.PI / 8 || a >= (7 * Math.PI) / 8) return 45;   // -
  if (a < (3 * Math.PI) / 8) return 92;                        // \
  if (a < (5 * Math.PI) / 8) return 124;                       // |
  return 47;                                                   // /
}

// ---------- look ----------
const params = new URLSearchParams(location.search);
const SEED = Number(params.get("seed")) || 1 + ((Math.random() * 1e6) | 0);   // ?seed=123 to keep a branch
const BG = [11, 17, 34];                  // night sky
const SKY_GLOW = [36, 52, 92];            // the sky right around the moon
const MOON = [238, 240, 236];
const MOON_MARE = [188, 198, 214];        // the darker patches on it
const GRID = "rgba(170,195,255,0.06)";     // cell border lines
const RAMP = ".:;=+*#%@";                 // sparse -> dense, picked by brightness
const BARK_LIGHT = [134, 128, 134];       // moonlit top of the wood
const BARK_DARK = [24, 22, 34];           // shaded underside
const SNOW = [234, 240, 252];
const SNOW_SHADE = [132, 156, 204];       // snow in its own shadow, down near the bark
const FLAKE = [214, 226, 248];
const BERRY = [212, 34, 46];
const BERRY_DARK = [86, 8, 22];
const CAP = [56, 60, 92];                 // the bullfinch's "black": lifted so it shows against the night
const CAP_INK = [128, 138, 184];
const WHITE = [232, 236, 246];
const BREAST_M = [234, 92, 86];
const BREAST_F = [180, 142, 130];
const BILL = [78, 80, 98];
// distant hills and forest, kept dim so the branch stays in front
const HILLS = [                           // far to near: where the ridge sits, how much it rolls, lit and shaded snow
  { base: 0.7, amp: 0.06, scale: 270, top: [36, 50, 88], low: [20, 30, 58] },
  { base: 0.79, amp: 0.045, scale: 200, top: [58, 76, 122], low: [28, 40, 76] },
  { base: 0.89, amp: 0.035, scale: 150, top: [96, 118, 168], low: [40, 54, 96] },
];
// Fir trees, drawn by hand, one character per cell: F bough, U trunk.
const FIRS = {
  fir: ["  F  ", " FFF ", " FFF ", "FFFFF", "FFFFF", "  U  "],
  firSmall: [" F ", "FFF", "FFF", " U "],
  firTall: ["  F  ", "  F  ", " FFF ", " FFF ", "FFFFF", " FFF ", "FFFFF", "  U  "],
  firSlim: [" F ", " F ", "FFF", "FFF", "FFF", " U "],
  firTiny: [" F ", "FFF"],              // far-off trees: just a tip and a skirt
  firSpike: ["F", "F"],
};
const TREE_SNOW = [186, 202, 238];
const TREE_SNOW_SHADE = [112, 132, 184];
const TRUNK = [44, 30, 28];
const FIR = [26, 56, 58];
const HAZE = [40, 54, 94];                // what distance fades things toward
const REFILL = 24;                        // seconds for knocked-off snow to settle back
const FUR = [196, 106, 52];
const FUR_FAR = [112, 62, 36];            // legs on the far side of the body
const BELLY = [234, 210, 174];
const TAIL = [206, 122, 58];
const TAIL_FRINGE = [242, 188, 124];
const EYE = [14, 12, 12];
const UP = -0.45;                         // direction growth bends toward (up and to the right)
const LEVELS = 2;                         // how many times branches fork

// ---------- the branch (continuous space, no grid involved) ----------
let W = 0, H = 0, time = 0;
const limbs = [];                         // parents always come before their children
const berries = [];

const radius = (l, t) => lerp(l.r0, l.r1, Math.pow(t, 0.85));

// Grow one limb and, recursively, everything that forks off it.
// `rel` is its angle relative to the parent where it attaches.
function grow(parent, at, rel, len, r0, level, rnd) {
  const n = clamp(Math.round(len / 20), 4, 40);
  const l = {
    parent, at, rel, n, seg: len / n, len, level, kids: [], side: 1,
    r0, r1: Math.max(0.8, r0 * 0.06),
    seed: (rnd() * 1e6) | 0, ph: rnd() * TAU,
    bend: new Float32Array(n),            // angle change at each joint, at rest
    rest: new Float32Array(n),            // direction of each segment, at rest
    a: new Float32Array(n),               // direction of each segment, right now
    snow: new Float32Array(n + 1).fill(1), // how much snow lies at each joint, 0..1
    x: new Float32Array(n + 1), y: new Float32Array(n + 1),
  };
  let a = (parent ? parent.rest[at - 1] : 0) + rel;
  for (let k = 0; k < n; k++) {
    // a little wobble, and a steady pull toward the light
    l.bend[k] = (rnd() - 0.5) * 0.13 + clamp(angleDiff(UP, a), -1, 1) * 0.035;
    a += l.bend[k];
    l.rest[k] = a;
  }
  // which side of the wood counts as its top, for anything walking on it
  let lean = 0;
  for (let k = 0; k < n; k++) lean += Math.cos(l.rest[k]);
  l.side = lean >= 0 ? 1 : -1;
  if (parent) parent.kids.push(l);
  limbs.push(l);

  let side = rnd() < 0.5 ? -1 : 1;
  if (level < LEVELS) {
    for (let k = level === 0 ? 5 + ((rnd() * 3) | 0) : 2 + ((rnd() * 2) | 0); k < n; k += 3 + ((rnd() * 4) | 0)) {
      const t = k / n;
      const clen = Math.min(H * 0.42, len * (1 - t) * (0.35 + rnd() * 0.3) + len * 0.06);
      const cr = radius(l, t) * (0.5 + rnd() * 0.2);
      if (cr >= 0.9 && clen > 36) grow(l, k, side * (0.55 + rnd() * 0.5), clen, cr, level + 1, rnd);
      if (rnd() < 0.8) side = -side;
    }
  }

  // berries hang in clusters along the thin wood and at the tip
  for (let k = 1; k <= n; k++) {
    if (radius(l, k / n) > 2.6 || rnd() > (k === n ? 0.75 : 0.4)) continue;
    const count = 3 + ((rnd() * 5) | 0);
    // `back` holds, for each berry, the time it grows back (0 = it is there)
    berries.push({ limb: l, at: k, n: count, seed: (rnd() * 1e6) | 0, ph: rnd() * TAU, back: new Float32Array(count) });
  }
}

function build() {
  limbs.length = 0; berries.length = 0;
  sq.on = false; sq.at = time + 1.5;                              // the squirrel comes back to the new branch
  const rnd = mulberry(SEED);
  grow(null, 0, -0.1, W * 0.86, clamp(Math.min(W, H) * 0.05, 14, 46), 0, rnd);

  flakes.length = 0; puffs.length = 0;
  birds.forEach((b, i) => { b.on = false; b.at = time + 4 + i * 6 + rb() * 5 + (i === 2 ? 20 : 0); });
  for (let i = 0, n = clamp(Math.round((W * H) / 8000), 40, 260); i < n; i++)
    flakes.push({ x: Math.random() * W, y: Math.random() * H, z: Math.random(), ph: Math.random() * TAU });
}

// ---------- snow ----------
const flakes = [];                        // falling snow; z is depth, 0 far away and 1 close
const puffs = [];                         // snow knocked off the wood

function puff(x, y) {
  if (puffs.length > 90) return;
  for (let i = 0; i < 3; i++)
    puffs.push({ x: x + (Math.random() - 0.5) * 10, y: y - 2, vx: (Math.random() - 0.5) * 60, vy: -15 - Math.random() * 45, life: 0.8 + Math.random() * 0.7 });
}

function stepSnow(dt) {
  const g = gust();
  for (const f of flakes) {
    // near flakes fall faster and are pushed harder by the wind
    f.y += (16 + 44 * f.z) * dt;
    f.x += (-(8 + 30 * f.z) * g + Math.sin(time * 0.9 + f.ph) * 7) * dt;
    if (f.y > H + 5) { f.y = -5; f.x = Math.random() * W; }
    if (f.x < -5) f.x = W + 5;
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i];
    p.vy += 260 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0 || p.y > H) puffs.splice(i, 1);
  }
  // snow settles back wherever it was knocked off
  for (const l of limbs) for (let k = 0; k <= l.n; k++) if (l.snow[k] < 1) l.snow[k] = Math.min(1, l.snow[k] + dt / REFILL);
}

// Whatever lands or runs on the wood clears the snow under it, and it falls away in a puff.
function clearSnow(l, s, reach = 0.4 * sq.size) {
  const k0 = Math.max(0, Math.ceil((s - reach) / l.seg)), k1 = Math.min(l.n, Math.floor((s + reach) / l.seg));
  for (let k = k0; k <= k1; k++) {
    if (l.snow[k] > 0.35) { surf(l, k * l.seg); puff(P.x, P.y); }
    l.snow[k] = 0;
  }
}

// Work out where every joint is right now: the rest shape plus a sway that
// thin wood feels much more than thick wood.
function gust() { return 0.35 + 0.65 * noise1(time * 0.13, 7); }
function pose() {
  const g = gust();
  for (const l of limbs) {
    const p = l.parent;
    let x = p ? p.x[l.at] : -10, y = p ? p.y[l.at] : H * 0.6;
    let a = (p ? p.a[l.at - 1] : 0) + l.rel;
    l.x[0] = x; l.y[0] = y;
    for (let k = 0; k < l.n; k++) {
      const wind = Math.sin(time * 0.8 + l.ph + k * 0.3) + 0.5 * Math.sin(time * 1.7 + l.ph * 1.7);
      a += l.bend[k] + (g * wind * 0.018) / (1 + radius(l, (k + 0.5) / l.n) * 0.6);
      l.a[k] = a;
      x += Math.cos(a) * l.seg; y += Math.sin(a) * l.seg;
      l.x[k + 1] = x; l.y[k + 1] = y;
    }
  }
}

// ---------- squirrel ----------
// It lives in "wood coordinates": which limb it is on and how far along. Its
// skeleton is rebuilt every frame from a handful of pose numbers (offsets along
// the wood and heights above it), so it rides the sway and follows the curves.
const NT = 10;                            // tail segments
const rs = mulberry(SEED ^ 0x5bd1e995);   // its own dice, so ?seed= replays the same squirrel
const sq = {
  on: false, at: 1.5, size: 80,
  l: null, s: 0, dir: 1, v: 0,            // limb, px along it, facing (+1 toward the tip), speed
  phase: 0,                               // where it is in the bounding cycle, 0..1
  q: 0, hp: 0,                            // how much of the sitting pose / jumping pose is blended in
  turnU: -1,                              // progress of a turn-around, 0..1 (-1 when not turning)
  mode: "run", until: 0, sit: false, turn: false, jump: false,
  decided: true, leaving: false, flick: 0, flickAt: 0, hipPrev: 0, tailInit: false,
  hop: { l: null, s: 0, dir: 1, s0: 0, t: 0, T: 1, h: 0, len: 1, lead: 0, sg: 1 },
  ta: new Float32Array(NT), tx: new Float32Array(NT + 1), ty: new Float32Array(NT + 1),
  legs: [0, 1, 2, 3].map(() => new Float32Array(6)),   // far front, far hind, near front, near hind
  hipx: 0, hipy: 0, shx: 0, shy: 0, cx: 0, cy: 0, bkx: 0, bky: -1,
  hx: 0, hy: 0, snx: 0, sny: 0, e0x: 0, e0y: 0, e1x: 0, e1y: 0, eyex: 0, eyey: 0,
};

// The point on top of limb `l`, `s` px from its base (s may run past either end).
const P = { x: 0, y: 0, tx: 1, ty: 0, nx: 0, ny: -1 };
function surf(l, s) {
  const f = s / l.seg;
  const k = clamp(Math.floor(f), 0, l.n - 1), t = f - k;
  const g = f - 0.5, k0 = clamp(Math.floor(g), 0, l.n - 2);
  const a = lerp(l.a[k0], l.a[k0 + 1], clamp(g - k0, 0, 1));     // eased across the joints
  const r = radius(l, clamp(s / l.len, 0, 1));
  P.tx = Math.cos(a); P.ty = Math.sin(a);
  P.nx = l.side * P.ty; P.ny = -l.side * P.tx;
  P.x = l.x[k] + (l.x[k + 1] - l.x[k]) * t + P.nx * r;
  P.y = l.y[k] + (l.y[k + 1] - l.y[k]) * t + P.ny * r;
}

// Body coordinates to screen: `off` px ahead of the body's centre, `h` px above
// the bark (or, in mid-jump, above the arc it is flying along).
const F = { x: 0, y: 0, fx: 1, fy: 0, nx: 0, ny: -1 };
function place(off, h) {
  if (sq.mode === "hop") {
    hopFrame(sq.hop.t + off / sq.hop.len);                         // parts ahead are further along the jump
  } else {
    // Turning around: every part swings from its place ahead of (or behind)
    // the centre to the mirrored place, passing through the middle. The head
    // goes first and the hips last, so the body folds back on itself and then
    // unfolds facing the other way.
    let c = 1;
    if (sq.turnU >= 0) {
      const lag = 0.5 * (1 - clamp(off / sq.size / 0.7 + 0.5, 0, 1));
      c = Math.cos(Math.PI * smooth(clamp(sq.turnU * 1.5 - lag, 0, 1)));
      if (Math.abs(c) < 0.05) c = c < 0 ? -0.05 : 0.05;             // never quite edge-on, so it always has a facing
    }
    surf(sq.l, sq.s + sq.dir * off * c);
    F.fx = P.tx * sq.dir * c; F.fy = P.ty * sq.dir * c; F.nx = P.nx; F.ny = P.ny; F.x = P.x; F.y = P.y;
  }
  F.x += F.nx * h; F.y += F.ny * h;
}

// A jump is one continuous track: the old limb up to the take-off point
// (u < 0), an arc through the air (0..1), then the new limb (u > 1). Each part
// of the body sits at its own place on that track, so the squirrel bends
// through the take-off and the landing like a train through a curve.
function hopFrame(u) {
  const b = sq.hop;
  if (u <= 0) {
    surf(sq.l, b.s0 + sq.dir * u * b.len);
    F.fx = P.tx * sq.dir; F.fy = P.ty * sq.dir; F.nx = P.nx; F.ny = P.ny; F.x = P.x; F.y = P.y;
    return;
  }
  if (u >= 1) {
    surf(b.l, b.s + b.dir * (u - 1) * b.len);
    F.fx = P.tx * b.dir; F.fy = P.ty * b.dir; F.nx = P.nx; F.ny = P.ny; F.x = P.x; F.y = P.y;
    return;
  }
  surf(sq.l, b.s0);
  const x0 = P.x, y0 = P.y, a0 = Math.atan2(P.ty * sq.dir, P.tx * sq.dir);
  surf(b.l, b.s);
  const a1 = Math.atan2(P.ty * b.dir, P.tx * b.dir);
  // facing: matches the old limb at take-off and the new one at landing, and
  // leans into the arc in between
  const arc = Math.atan2(P.y - y0 - 4 * b.h * (1 - 2 * u), P.x - x0);
  let a = a0 + angleDiff(a1, a0) * smooth(u);
  const lean = angleDiff(arc, a);
  a += lean * Math.max(0, Math.cos(lean)) * Math.sin(Math.PI * u) * 0.6;
  F.fx = Math.cos(a); F.fy = Math.sin(a);
  F.nx = b.sg * F.fy; F.ny = -b.sg * F.fx;
  F.x = lerp(x0, P.x, u); F.y = lerp(y0, P.y, u) - 4 * b.h * u * (1 - u);
}

function spawn() {
  sq.on = true;
  sq.size = clamp(Math.min(W, H) * 0.17, 70, 170);                // nose to rump, px
  sq.l = limbs[0]; sq.s = -1.6 * sq.size; sq.dir = 1; sq.v = 0;   // runs in along the main limb
  sq.mode = "run"; sq.until = time + 2.5 + rs() * 2; sq.phase = 0.8;
  sq.q = 0; sq.hp = 0; sq.turnU = -1; sq.decided = true; sq.leaving = false; sq.tailInit = false;
}

function pauseNow(turn) {
  sq.mode = "pause";
  sq.until = time + 0.5 + rs() * 2.4;
  sq.turn = turn || rs() < 0.15;
  sq.jump = !turn && rs() < 0.3;
  surf(sq.l, sq.s);
  // only sits up where the wood is thick and fairly level
  sq.sit = Math.abs(P.ty) < 0.45 && radius(sq.l, clamp(sq.s / sq.l.len, 0, 1)) > 5 && rs() < 0.55;
  sq.flickAt = time + 0.2;
}

// Where it would jump from: half a body length ahead, so that it is its nose
// that reaches the take-off point first. Never past the end of the wood.
const takeOff = () => clamp(sq.s + sq.dir * 0.45 * sq.size, Math.min(sq.s, 0), Math.max(sq.s, sq.l.len));

// Leap from where it stands to a spot on another limb.
function startHop(l2, s2) {
  const h = sq.hop, S = sq.size;
  h.s0 = takeOff();
  surf(sq.l, h.s0);
  const x0 = P.x, y0 = P.y;
  surf(l2, s2);
  const d = Math.hypot(P.x - x0, P.y - y0) || 1;
  h.l = l2; h.s = s2;
  // It always lands facing the same way round as it took off (callers only
  // offer landings where that also means facing the way it is travelling), so
  // nothing ever has to flip in mid-air.
  h.sg = sq.l.side * sq.dir;
  h.dir = h.sg * l2.side;
  h.T = clamp(d / (2.2 * S), 0.3, 0.6);                            // time in the air
  h.h = 0.18 * d + 0.12 * S;                                       // height of the arc
  h.len = Math.max(0.3 * S, Math.sqrt(d * d + 5.33 * h.h * h.h)); // length of the arc
  // The jump starts with its nose at the take-off point and ends once its
  // rump has reached the landing point, so no part of it ever skips.
  h.lead = (0.45 * S) / h.len;
  h.t = -Math.abs(h.s0 - sq.s) / h.len;
  sq.v = Math.max(sq.v, 1.8 * S);
  sq.mode = "hop";
}

// Look for somewhere within jumping distance on a different limb.
function tryJump() {
  const S = sq.size;
  surf(sq.l, takeOff());
  const x = P.x, y = P.y, fx = P.tx * sq.dir, fy = P.ty * sq.dir;
  for (let i = 0; i < 20; i++) {
    const c = limbs[(rs() * limbs.length) | 0];
    if (c === sq.l) continue;
    const s2 = rs() * c.len;
    if (radius(c, s2 / c.len) < 0.05 * S) continue;
    surf(c, s2);
    const d = Math.hypot(P.x - x, P.y - y);
    if ((P.x - x) * fx + (P.y - y) * fy < 0.5 * d) continue;      // only leaps at things in front of it
    if (d < 0.7 * S || d > 3 * S || P.x < W * 0.05 || P.x > W * 0.95 || P.y < H * 0.05 || P.y > H * 0.95) continue;
    startHop(c, s2);
    return true;
  }
  return false;
}

function stepSquirrel(dt) {
  if (!sq.on) {
    if (time < sq.at || !limbs.length) return;
    spawn();
  }
  const S = sq.size, V = 2.2 * S;

  if (sq.mode === "hop") {
    const h = sq.hop;
    h.t += dt / h.T;
    if (h.t < 0 || h.t > 1) sq.phase = (sq.phase + ((dt / h.T) * h.len) / (1.1 * S)) % 1;   // still on its feet
    if (h.t >= 1 + h.lead) {
      sq.l = h.l; sq.dir = h.dir; sq.s = h.s + h.dir * (h.t - 1) * h.len;
      sq.mode = "run"; sq.until = time + 0.4 + rs() * 1.8;
    }
  }
  // the flying pose eases in after take-off and out again before the landing
  sq.hp = sq.mode === "hop" ? smooth(clamp(sq.hop.t / 0.25, 0, 1)) * smooth(clamp((1 - sq.hop.t) / 0.3, 0, 1)) : 0;

  if (sq.mode === "run") {
    const l = sq.l;
    sq.v += (V - sq.v) * Math.min(1, dt * 8);
    const ds = sq.v * dt, ns = sq.s + sq.dir * ds;
    sq.phase = (sq.phase + ds / (1.1 * S)) % 1;                   // one bound covers 1.1 body lengths

    let hopped = false;
    for (const c of l.kids) {
      // passing a fork: sometimes it takes the side branch
      const sc = c.at * l.seg - sq.dir * 0.45 * S;                  // its nose reaches the fork
      if ((sq.s - sc) * (ns - sc) <= 0 && ds > 0 && c.r0 >= 0.08 * S && c.len > 2.2 * S && c.side === l.side * sq.dir && rs() < 0.5) {
        startHop(c, Math.min(c.len * 0.5, radius(l, c.at / l.n) + 0.45 * S));
        hopped = true;
        break;
      }
    }
    if (!hopped) {
      const p = l.parent;
      if (p && sq.dir < 0 && ns < radius(p, l.at / p.n) + 0.75 * S) {
        // back at the fork: step down onto the limb this one grows from
        const d = -l.side * p.side;                                 // the way it is already facing
        startHop(p, clamp(l.at * p.seg + d * 0.4 * S, 0.3 * S, p.len - 0.3 * S));
      } else {
        sq.s = ns;
        if (ns > 2 * S) sq.decided = false;
        if (sq.dir > 0 && (radius(l, clamp(ns / l.len, 0, 1)) < 0.035 * S || ns > l.len - 0.3 * S)) {
          pauseNow(true);                                           // wood too thin to carry it: stop and turn back
        } else if (!p && sq.dir < 0 && ns < 1.2 * S && !sq.decided) {
          sq.decided = true;
          sq.leaving = rs() < 0.5;                                  // at the trunk end: go home, or stay
          if (!sq.leaving) pauseNow(true);
        } else if (!p && ns < -1.7 * S) {
          sq.on = false; sq.at = time + 4 + rs() * 8;               // gone; back in a while
          return;
        } else {
          surf(l, ns);
          const fx = P.tx * sq.dir, fy = P.ty * sq.dir, m = 0.3 * S;
          if ((P.x > W + m && fx > 0) || (P.y < -m && fy < 0) || (P.y > H + m && fy > 0)) sq.dir = -sq.dir;
          else if (time > sq.until && P.x > 0) pauseNow(false);
        }
      }
    }
  } else if (sq.mode === "pause") {
    sq.v += (0 - sq.v) * Math.min(1, dt * 14);
    sq.s += sq.dir * sq.v * dt;
    sq.phase = (sq.phase + (sq.v * dt) / (1.1 * S)) % 1;
    const sitting = sq.sit && time < sq.until;
    sq.q += ((sitting ? 1 : 0) - sq.q) * Math.min(1, dt * 7);
    if (time > sq.flickAt) { sq.flick = 1; sq.flickAt = time + 0.4 + rs() * 1.6; }
    if (sq.turnU >= 0) {
      sq.turnU += dt / 0.45;
      if (sq.turnU >= 1) { sq.dir = -sq.dir; sq.turnU = -1; sq.turn = false; }
    } else if (time > sq.until && sq.q < 0.15) {
      if (sq.turn) sq.turnU = 0;                                    // swing round first, then carry on
      else if (!(sq.jump && tryJump())) { sq.mode = "run"; sq.until = time + 0.5 + rs() * 2.2; sq.phase = 0.8; }
    }
  }
  sq.flick *= Math.exp(-dt * 5);
  if (sq.mode !== "hop") clearSnow(sq.l, sq.s);
  else if (sq.hop.t > 1) clearSnow(sq.hop.l, sq.hop.s + sq.hop.dir * (sq.hop.t - 1) * sq.hop.len);
  skeleton(dt);
}

// Two-bone inverse kinematics: a leg rooted at (rx,ry) reaches for (tx,ty); the
// joint bends toward the side (px,py) points to. Writes root, joint and foot.
function solveLeg(out, rx, ry, tx, ty, l1, l2, px, py) {
  let dx = tx - rx, dy = ty - ry;
  const d = Math.hypot(dx, dy) || 1e-3;
  const dd = clamp(d, Math.abs(l1 - l2) + 0.01, l1 + l2 - 0.01);  // can't reach further than the leg is long
  dx /= d; dy /= d;
  const a = (l1 * l1 + dd * dd - l2 * l2) / (2 * dd), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const sgn = -dy * px + dx * py < 0 ? -1 : 1;
  out[0] = rx; out[1] = ry;
  out[2] = rx + dx * a - dy * h * sgn; out[3] = ry + dy * a + dx * h * sgn;
  out[4] = rx + dx * dd; out[5] = ry + dy * dd;
}

// Where a foot is during the bound, as [px ahead of centre, px above the bark]
// in body lengths. For the first 35% of its cycle it is planted: it moves back
// exactly as fast as the body moves forward, so it stays put on the wood.
const FOOT = [0, 0];
function footRun(p, land) {
  if (p < 0.35) { FOOT[0] = land - p * 1.1; FOOT[1] = 0; return; }
  const u = (p - 0.35) / 0.65;
  FOOT[0] = lerp(land - 0.385, land, smooth(u));
  FOOT[1] = 0.1 * Math.sin(Math.PI * u);
}

function skeleton(dt) {
  const S = sq.size, q = sq.q, hp = sq.hp, ph = sq.phase;
  const g = smooth(clamp(sq.v / (2.2 * S), 0, 1));                 // 0 standing still, 1 at full run
  // blend the four poses: standing, running, sitting up, flying
  const mix = (stand, run, sit, fly) => lerp(lerp(lerp(stand, run, g), sit, q), fly, hp);

  // spine: stretched out as it launches off the hind feet, tucked as they swing under
  const e = Math.cos(TAU * (ph - 0.9));
  const shO = mix(0.26, 0.27 + 0.07 * e, 0.06, 0.34), shH = mix(0.2, 0.27 - 0.05 * Math.cos(TAU * (ph - 0.15)), 0.5, 0.22);
  const hipO = mix(-0.24, -0.27 - 0.07 * e, -0.08, -0.34), hipH = mix(0.2, 0.27 - 0.05 * Math.cos(TAU * (ph - 0.6)), 0.19, 0.22);
  const arch = mix(0.035, 0.02 + 0.05 * (1 - e), 0.06, 0);

  place(hipO * S, hipH * S);
  sq.hipx = F.x; sq.hipy = F.y;
  const hfx = F.fx, hfy = F.fy, hnx = F.nx, hny = F.ny;            // frame at the hips, for the tail
  place(shO * S, shH * S);
  sq.shx = F.x; sq.shy = F.y;
  const fx = F.fx, fy = F.fy, nx = F.nx, ny = F.ny;                // frame at the shoulders

  // which way the back faces: square to the spine, away from the wood
  let sx = sq.shx - sq.hipx, sy = sq.shy - sq.hipy;
  const sl = Math.hypot(sx, sy) || 1;
  sx /= sl; sy /= sl;
  let bx = -sy, by = sx;
  if (bx * (nx - 0.5 * fx) + by * (ny - 0.5 * fy) < 0) { bx = -bx; by = -by; }
  sq.bkx = bx; sq.bky = by;
  sq.cx = (sq.hipx + sq.shx) / 2 + bx * arch * 2 * S;
  sq.cy = (sq.hipy + sq.shy) / 2 + by * arch * 2 * S;

  // legs: far pair a beat behind the near pair
  for (let i = 0; i < 4; i++) {
    const front = i % 2 === 0, far = i < 2;
    const p = (ph + (far ? 0.07 : 0) + (front ? 0 : 0.55)) % 1;
    footRun(p, front ? 0.52 : 0.05);
    const off = front ? mix(far ? 0.37 : 0.32, FOOT[0], far ? 0.25 : 0.21, 0.6) : mix(far ? -0.09 : -0.14, FOOT[0], far ? 0.07 : 0.03, -0.62);
    const h = front ? mix(0, FOOT[1], far ? 0.37 : 0.33, 0.1) : mix(0, FOOT[1], 0, 0.12);
    place(off * S, Math.max(0, h) * S);
    if (front) solveLeg(sq.legs[i], sq.shx - bx * 0.05 * S, sq.shy - by * 0.05 * S, F.x, F.y, 0.18 * S, 0.18 * S, -fx, -fy);
    else solveLeg(sq.legs[i], sq.hipx - bx * 0.04 * S, sq.hipy - by * 0.04 * S, F.x, F.y, 0.21 * S, 0.21 * S, hfx, hfy);
  }

  // head: out in front when running, up above the shoulders when sitting
  const look = sq.mode === "pause" ? 0.03 * Math.sin(time * 1.7) + 0.02 * Math.sin(time * 4.3) : 0;
  const hf = lerp(0.22, 0.1, q) * S, hu = (lerp(0.07, 0.2, q) + look) * S;
  sq.hx = sq.shx + fx * hf + nx * hu; sq.hy = sq.shy + fy * hf + ny * hu;
  const tilt = lerp(-0.2, 0.05, q) + look * 4, ct = Math.cos(tilt), st = Math.sin(tilt);
  sq.snx = sq.hx + (fx * ct + nx * st) * 0.2 * S; sq.sny = sq.hy + (fy * ct + ny * st) * 0.2 * S;
  sq.e0x = sq.hx + (nx * 0.11 - fx * 0.06) * S; sq.e0y = sq.hy + (ny * 0.11 - fy * 0.06) * S;
  sq.e1x = sq.hx + (nx * 0.23 - fx * 0.1) * S; sq.e1y = sq.hy + (ny * 0.23 - fy * 0.1) * S;
  sq.eyex = sq.hx + (fx * 0.06 + nx * 0.04) * S; sq.eyey = sq.hy + (fy * 0.06 + ny * 0.04) * S;

  // tail: every joint chases a target angle, the far ones more lazily, so the
  // tail lags behind the body and whips on each bound
  const beta = Math.atan2(-hfy, -hfx);                             // straight out behind
  const sg = -hfx * hny + hfy * hnx >= 0 ? 1 : -1;                 // which way round is "up"
  const vn = dt > 0 ? clamp(((hipH - sq.hipPrev) * S) / dt, -400, 400) : 0;
  sq.hipPrev = hipH;
  let x = sq.hipx - hfx * 0.1 * S, y = sq.hipy - hfy * 0.1 * S;
  sq.tx[0] = x; sq.ty[0] = y;
  for (let k = 0; k < NT; k++) {
    const u = k / (NT - 1);
    // at rest it stands up behind the back and curls over at the tip
    const rest = 0.9 + 1.0 * Math.sin((Math.min(u, 0.75) / 0.75) * Math.PI / 2) - 1.3 * smooth(Math.max(0, (u - 0.75) / 0.25));
    const run = 0.45 - 0.55 * u + 0.28 * Math.sin(TAU * ph - u * 3);   // streams out behind with a ripple
    const lift = mix(rest, run, rest, 0.2 - 0.2 * u) + sq.flick * 0.5 * Math.sin(time * 20) * u - vn * 0.0016 * u;
    const want = beta + sg * lift;
    if (!sq.tailInit) sq.ta[k] = want;
    else sq.ta[k] += angleDiff(want, sq.ta[k]) * Math.min(1, dt * lerp(20, 7, u));
    x += Math.cos(sq.ta[k]) * (S / NT); y += Math.sin(sq.ta[k]) * (S / NT);
    sq.tx[k + 1] = x; sq.ty[k + 1] = y;
  }
  sq.tailInit = true;
}

// ---------- bullfinches ----------
// A pair, and now and then a third. Each one flies in, settles on thin wood
// beside a bunch of berries, fidgets and feeds, and flies off again. They keep
// clear of the squirrel and flush if it comes close.
const rb = mulberry(SEED ^ 0x2545f491);
const birdSize = () => clamp(Math.min(W, H) * 0.025, 9, 22);       // body radius, px
const birds = [0, 1, 2].map((i) => ({
  on: false, at: 0, male: i !== 1, extra: i === 2,
  mode: "fly", x: 0, y: 0, face: 1,
  l: null, s: 0, home: 0, cl: null,       // perch: limb, px along it, the spot it settled on, its berries
  x0: 0, y0: 0, x1: 0, y1: 0, u: 0, T: 1, lift: 0, leaving: false, flapping: true,
  ph: i * 0.37, flap: 0, act: 0, leaveAt: 0, tx: 0, ty: 0, up: false,
  hop: 0, hopFrom: 0, hopTo: 0, peck: 0, pecked: true, look: 1, lookUntil: 0, fluff: 0,
  lookAt: -9, flickAt: -9, landed: -9,    // when it last turned its head, flicked its tail, touched down
  launch: 0, launchT: 1, hurry: false,    // counting down to a take-off
}));

const berriesLeft = (c) => { let n = 0; for (let j = 0; j < c.n; j++) if (c.back[j] <= time) n++; return n; };

// Somewhere to sit: thin, fairly level wood on screen, preferably right beside
// berries, away from the squirrel and from the other birds.
function findPerch(b, clear) {
  const B = birdSize();
  for (let i = 0; i < 40; i++) {
    let l, s, cl = null;
    if (berries.length && rb() < 0.8) {
      cl = berries[(rb() * berries.length) | 0];
      if (!berriesLeft(cl)) continue;
      l = cl.limb; s = Math.max(0, cl.at * l.seg - 1.2 * B);
    } else {
      l = limbs[(rb() * limbs.length) | 0]; s = rb() * l.len;
    }
    const r = radius(l, s / l.len);
    if (r > 8 || r < 0.9) continue;
    surf(l, s);
    if (Math.abs(P.tx) < 0.5 || P.x < W * 0.06 || P.x > W * 0.94 || P.y < H * 0.1 || P.y > H * 0.92) continue;
    if (sq.on && Math.hypot(P.x - sq.shx, P.y - sq.shy) < clear * sq.size) continue;
    let taken = false;
    for (const o of birds) if (o !== b && o.on && !o.leaving && o.l) { const x = P.x, y = P.y; surf(o.l, o.s); if (Math.hypot(P.x - x, P.y - y) < 4.5 * B) taken = true; P.x = x; P.y = y; }
    if (taken) continue;
    b.l = l; b.s = b.home = s; b.cl = cl;
    return true;
  }
  return false;
}

// Take off for wherever it has decided to go. From a perch it first crouches
// and throws its wings up, which takes a moment (less if it is startled).
function flyOff(b, lift, hurry = false) {
  b.lift = lift; b.hurry = hurry;
  b.hop = 0; b.peck = 0; b.fluff = 0; b.look = 1;
  if (b.mode === "perch") b.launch = b.launchT = hurry ? 0.14 : 0.24;
  else beginFlight(b);
}

function beginFlight(b) {
  b.mode = "fly"; b.x0 = b.x; b.y0 = b.y; b.u = 0; b.launch = 0;
  let tx = b.x1, ty = b.y1;
  if (!b.leaving) { surf(b.l, b.s); tx = P.x; ty = P.y; }
  b.T = clamp(Math.hypot(tx - b.x, ty - b.y) / 340, 0.5, 4) * (b.hurry ? 0.75 : 1);
}

// Which drawing a perched bird shows right now. Every change of pose passes
// through an in-between drawing, so nothing switches in a single step.
function birdArt(b) {
  if (b.launch > 0) return b.launch > 0.5 * b.launchT ? PERCHED.lean : PERCHED.flare;
  const down = time - b.landed;
  if (down < 0.14) return PERCHED.flare;                           // wings still up as it touches down
  if (down < 0.3) return PERCHED.fold;
  if (b.peck > 0) { const u = 1 - b.peck; return u < 0.22 || u > 0.78 ? PERCHED.lean : PERCHED.peck; }
  const fl = time - b.flickAt;
  if (fl < 0.42) return fl < 0.07 || fl > 0.3 ? PERCHED.flickMid : PERCHED.flick;
  if (time - b.lookAt < 0.12) return PERCHED.front;                // head passes through face-on
  if (b.look < 0) return PERCHED.look;
  return b.fluff > 0.75 ? PERCHED.fluff : b.fluff > 0.45 ? PERCHED.fluffMid : PERCHED.up;
}

function leave(b, hurry = false) {
  b.leaving = true;
  b.x1 = b.x > W / 2 ? W + 80 : -80;
  b.y1 = b.y - 60 - rb() * 220;
  flyOff(b, 0, hurry);
}

function stepBirds(dt) {
  const B = birdSize();
  for (const b of birds) {
    if (!b.on) {
      if (time < b.at || !limbs.length) continue;
      if (!findPerch(b, 2.6)) { b.at = time + 3; continue; }
      b.on = true; b.leaving = false;
      b.x = rb() < 0.5 ? -60 : W + 60; b.y = H * (0.05 + rb() * 0.5);
      b.leaveAt = time + 25 + rb() * 45;
      b.mode = "fly";
      flyOff(b, 0);
    }
    if (b.launch > 0) {                                            // gathering itself to take off
      b.launch -= dt;
      if (b.launch <= 0) beginFlight(b);
      continue;
    }

    if (b.mode === "fly") {
      b.u += dt / b.T;
      b.flap += dt * 9;
      let tx = b.x1, ty = b.y1;
      if (!b.leaving) { surf(b.l, b.s); tx = P.x; ty = P.y - 0.85 * B; }
      const u = Math.min(1, b.u);
      const e = b.leaving ? u * (0.5 + 0.5 * u) : 1 - Math.pow(1 - u, 1.7);   // slows into a landing
      // Finches fly in bounds: a burst of flapping that climbs, then wings
      // shut and a dip. It fades out near the perch at either end.
      const env = smooth(clamp(u * 4, 0, 1)) * (b.leaving ? 1 : smooth(clamp((1 - u) * 3, 0, 1)));
      const cyc = (time * 1.9 + b.ph) % 1;
      b.flapping = cyc < 0.55 || u < 0.12 || (!b.leaving && u > 0.8);
      if (Math.abs(tx - b.x0) > 4) b.face = tx > b.x0 ? 1 : -1;
      b.x = lerp(b.x0, tx, e);
      b.y = lerp(b.y0, ty, e) - Math.sin(cyc * TAU) * 14 * env - b.lift * Math.sin(Math.PI * u);
      if (b.u >= 1) {
        if (b.leaving) { b.on = false; b.at = time + (b.extra ? 30 + rb() * 60 : 8 + rb() * 22); continue; }
        b.mode = "perch"; b.act = time + 0.6 + rb(); b.landed = time;
        clearSnow(b.l, b.s, 1.1 * B);
      } else continue;                                             // still in the air
    }

    // perched
    let s = b.s, bump = 0;
    if (b.hop > 0) {
      b.hop -= dt / 0.16;
      const k = 1 - Math.max(0, b.hop);
      s = lerp(b.hopFrom, b.hopTo, smooth(k)); bump = Math.sin(Math.PI * k) * 0.4 * B;
      if (b.hop <= 0) { b.s = b.hopTo; clearSnow(b.l, b.s, 0.8 * B); }
    }
    surf(b.l, s);
    b.x = P.x; b.y = P.y - 0.85 * B - bump;
    b.tx = P.x; b.ty = P.y + radius(b.l, clamp(s / b.l.len, 0, 1)); b.up = bump > 0.2 * B;   // the twig under its feet
    if (b.cl) { const cx = b.cl.limb.x[b.cl.at]; if (Math.abs(cx - b.x) > 2) b.face = cx > b.x ? 1 : -1; }

    if (b.peck > 0) {
      b.peck -= dt / 0.5;
      if (b.peck < 0.5 && !b.pecked) {
        b.pecked = true;
        for (let j = 0; j < b.cl.n; j++) if (b.cl.back[j] <= time) { b.cl.back[j] = time + 45 + rb() * 45; break; }
      }
    }
    b.fluff = Math.min(1, b.fluff + dt * 0.1);                    // slowly puffs up while it sits
    if (b.look < 0 && time > b.lookUntil) { b.look = 1; b.lookAt = time; }

    // the squirrel: flush if it is running or jumping nearby, or simply too close
    if (sq.on && Math.hypot(b.x - sq.shx, b.y - sq.shy) < sq.size * (sq.mode === "pause" ? 1.1 : 2)) {
      b.leaving = false;
      if (findPerch(b, 3.6)) flyOff(b, 40 + rb() * 50, true); else leave(b, true);
      continue;
    }
    // it only starts something new once the last movement has finished
    const settled = b.hop <= 0 && b.peck <= 0 && b.look > 0 && time - b.lookAt > 0.15 && time - b.flickAt > 0.45 && time - b.landed > 0.35;
    if (time > b.leaveAt && settled) { leave(b); continue; }

    if (time > b.act && settled) {
      b.act = time + 0.5 + rb() * 2.2;
      const r = rb(), atHome = Math.abs(b.s - b.home) < 0.4 * B, food = b.cl && berriesLeft(b.cl) > 0;
      if (b.cl && !food) {
        if (findPerch(b, 2.6)) flyOff(b, 20); else leave(b);      // stripped this bunch: on to the next
      } else if (food && atHome && r < 0.45) {
        b.peck = 1; b.pecked = false; b.look = 1; b.fluff *= 0.4;
      } else if (r < 0.65) {
        b.hop = 1; b.hopFrom = b.s; b.fluff *= 0.5;
        b.hopTo = atHome ? clamp(b.home + (rb() < 0.5 ? -1 : 1) * (0.5 + rb() * 0.5) * B, 0, b.l.len) : b.home;
      } else if (r < 0.82) {
        b.look = -1; b.lookAt = time; b.lookUntil = time + 0.6 + rb();   // glances over its shoulder
      } else if (r < 0.94) {
        b.flickAt = time;
      } else if (findPerch(b, 2.6)) flyOff(b, 20);
    }
  }
}

// A perched bullfinch is too small to build from shapes, so it is drawn by
// hand, one character per cell, facing right. K is the black of the cap, wing
// and tail, R the breast and cheek, W the white rump, E the eye, B the bill
// (V when it points down). The feet are under column 7 of the bottom row.
const PERCHED = {
  up: [
    "       KKK    ",
    "      KKEKB   ",

  ],

    "      KKK     ",
    "     BKEKK    ",
    "      RRRKK   ",
    "   KKKKRRRR   ",
    "  KKKKRRRRR   ",
    " KKWWRRRRR    ",
    "KK    RRR     ",
  ],
  fluff: [                                // puffed up against the cold
    "       KKK    ",
    "      KKEKB   ",
    "    KKKRRRR   ",
    "  KKKKKRRRRR  ",
    " KKKKKRRRRRR  ",
    " KKWWRRRRRR   ",
    "KK   RRRRR    ",
  ],
  flick: [                                // tail cocked up

    "      KKEKB   ",
    "KK   KKRRR    ",
    " KKKKKKRRRR   ",
    "  KKKKRRRRR   ",
    "   WWRRRRR    ",
    "      RRR     ",
  ],
  // in-between drawings
  lean: [                                 // tipping forward: on the way to a peck, or crouching to take off
    "              ",
    "        KKK   ",
    "    KKKKKEKB  ",
    "  KKKKKRRRRR  ",
    " KKKKRRRRRR   ",
    "KKWWRRRRRR    ",
    "      RRR     ",
  ],
  front: [                                // head face-on, halfway through a turn
    "      KKKK    ",
    "      EKKE    ",
    "     KRRRR    ",
    "   KKKKRRRR   ",
    "  KKKKRRRRR   ",
    " KKWWRRRRR    ",
    "KK    RRR     ",
  ],
  flickMid: [                             // tail level, halfway up
    "       KKK    ",
    "      KKEKB   ",
    "     KKRRR    ",
    "   KKKKRRRR   ",
    "KKKKKKRRRRR   ",
    "   WWRRRRR    ",
    "      RRR     ",
  ],
  fluffMid: [
    "       KKK    ",
    "      KKEKB   ",
    "     KKRRRR   ",
    "   KKKKRRRRR  ",
    "  KKKKRRRRRR  ",
    " KKWWRRRRRR   ",
    "KK    RRRR    ",
  ],
  flare: [                                // wings thrown up: braking to land, or springing off
    "   KK         ",
    "   KKK        ",
    "    KK KKK    ",
    "     KKKEKB   ",
    "     KKRRR    ",
    "    KKKRRRR   ",
    "    KWRRRRR   ",
    "   KKWRRRR    ",
    "  KK  RRR     ",
  ],
  fold: [                                 // wings coming down to close
    "       KKK    ",
    " KK   KKEKB   ",
    "  KKKKKRRR    ",
    "   KKKKRRRR   ",
    "  KKKKRRRRR   ",
    " KKWWRRRRR    ",
    "KK    RRR     ",
  ],
  peck: [                                 // leaning down to the berries
    "              ",
    "              ",
    "    KKKK      ",
    "  KKKKKRRKK   ",
    " KKKKRRRRKEK  ",
    "KKWWRRRRRRKV  ",
    "      RRR     ",

// Is (px,py) inside the tapered capsule a->b? Returns how far along (0..1), or -1.
function inCapsule(px, py, ax, ay, bx, by, ra, rb2) {
  const dx = bx - ax, dy = by - ay, t = clamp(((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy || 1), 0, 1);
  const ex = px - (ax + dx * t), ey = py - (ay + dy * t), r = lerp(ra, rb2, t);
  return ex * ex + ey * ey <= r * r ? t : -1;

// ---------- renderer (everything snaps to the character grid here) ----------
const renderer = {
  canvas: null, ctx: null, bg: null, dpr: 1,
  cw: 10, ch: 15, cols: 0, rows: 0, font: "monospace",
  flag: new Uint8Array(0), glyph: new Uint16Array(0),
  colour: new Uint32Array(0), fill: new Uint32Array(0),

  resize(w, h, dpr) {
    this.dpr = dpr;
    this.cw = clamp(Math.round(w / 260), 4, 8);
    this.ch = Math.round(this.cw * 1.5);
    this.cols = Math.ceil(w / this.cw);
    this.rows = Math.ceil(h / this.ch);
    const n = this.cols * this.rows;
    this.flag = new Uint8Array(n); this.glyph = new Uint16Array(n);
    this.colour = new Uint32Array(n); this.fill = new Uint32Array(n);
    this.canvas.width = Math.round(w * dpr);
    this.canvas.height = Math.round(h * dpr);

    // static backdrop: night sky, stars, the moon and the cell grid
    this.bg.width = this.canvas.width; this.bg.height = this.canvas.height;
    const b = this.bg.getContext("2d");
    b.setTransform(dpr, 0, 0, dpr, 0, 0);
    b.fillStyle = `rgb(${BG})`;
    b.fillRect(0, 0, w, h);
    const { cw, ch, cols, rows } = this;
    const mx = w * 0.8, my = h * 0.2, mr = clamp(Math.min(w, h) * 0.085, 30, 80);   // the moon
    b.font = `600 ${Math.round(ch * 0.78)}px ${this.font}`;
    b.textAlign = "center";
    b.textBaseline = "middle";
    const STEPS = 7;
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++) {
        const x = (c + 0.5) * cw, y = (r + 0.5) * ch, d = Math.hypot(x - mx, y - my);
        if (d < mr) {
          // the disc: pale, with darker seas, and dimmer toward the limb
          const mare = noise2(x / (mr * 0.55), y / (mr * 0.55), 77) > 0.56;
          const col = mare ? MOON_MARE : MOON, k = 1 - 0.14 * (d / mr) * (d / mr);
          b.fillStyle = `rgb(${Math.round(col[0] * k)},${Math.round(col[1] * k)},${Math.round(col[2] * k)})`;
          b.fillRect(c * cw + 1, r * ch + 1, cw - 1, ch - 1);
          if (mare) { b.fillStyle = "rgba(120,134,160,0.9)"; b.fillText(hash(c, r, 5) < 0.5 ? "." : ":", x, y); }
          continue;
        }
        // the glow around it, stepped like contour bands, with dithered edges
        const glow = Math.pow(clamp(1 - (d - mr) / (mr * 6.5), 0, 1), 2.2);
        const band = Math.round(glow * STEPS + (hash(c, r, 21) - 0.5) * 0.6);
        if (band > 0) {
          const t = Math.min(STEPS, band) / STEPS;
          b.fillStyle = `rgb(${Math.round(lerp(BG[0], SKY_GLOW[0], t))},${Math.round(lerp(BG[1], SKY_GLOW[1], t))},${Math.round(lerp(BG[2], SKY_GLOW[2], t))})`;
          b.fillRect(c * cw, r * ch, cw, ch);
        }
        // stars, fewer where the moon washes them out
        const st = hash(c, r, 31);
        if (st < 0.0035 * (1 - glow)) {
          b.fillStyle = `rgba(214,226,255,${(0.25 + 0.5 * hash(c, r, 32)).toFixed(2)})`;
          b.fillText(st < 0.0006 ? "+" : ".", x, y);
        }
      }

    // hills, far to near, each one a rolling ridge of snow lit from the moon's
    // side, with forest growing on it
    const rnd = mulberry(SEED + 77);
    const ridge = (hl, k, x) => h * hl.base - h * hl.amp * ((noise1(x / hl.scale, SEED + k) - 0.5) * 2 + (noise1(x / (hl.scale * 0.3), SEED + 9 + k) - 0.5) * 0.5);
    const rgb = (c0, c1, c2) => `rgb(${Math.round(clamp(c0, 0, 255))},${Math.round(clamp(c1, 0, 255))},${Math.round(clamp(c2, 0, 255))})`;
    // one cell of hillside
    const ground = (hl, k, c, r) => {
      const x = (c + 0.5) * cw, d = (r + 0.5) * ch - ridge(hl, k, x);
      const lit = clamp(0.55 + (ridge(hl, k, x + 14) - ridge(hl, k, x - 14)) * 0.045, 0.15, 1);   // slopes facing the moon are brighter
      const t = lit * Math.pow(clamp(1 - d / (h * 0.16), 0, 1), 1.6) * (0.92 + 0.16 * hash(c, r, 40 + k));
      b.fillStyle = rgb(lerp(hl.low[0], hl.top[0], t), lerp(hl.low[1], hl.top[1], t), lerp(hl.low[2], hl.top[2], t));
      b.fillRect(c * cw, r * ch, cw, ch);
      const tx = hash(c, r, 50 + k);
      if (tx < 0.05) {                                             // a few marks so the snow is not a flat wash
        b.fillStyle = rgb(hl.top[0] * 1.25, hl.top[1] * 1.25, hl.top[2] * 1.2);
        b.fillText(tx < 0.02 ? "." : tx < 0.035 ? "," : "`", x, (r + 0.5) * ch);
      }
    };

    // Stamp a fir, block by block like everything in front, its foot on `row`.
    // `fade` is how far it is washed out toward the haze of distance.
    const stamp = (art, c0, row, fade, seed) => {
      const wide = art[0].length, tall = art.length;
      const cell = (c, r, col, kk, glyph, ink) => {
        b.fillStyle = rgb(lerp(col[0] * kk, HAZE[0], fade), lerp(col[1] * kk, HAZE[1], fade), lerp(col[2] * kk, HAZE[2], fade));
        b.fillRect(c * cw + 1, r * ch + 1, cw - 1, ch - 1);
        b.fillStyle = rgb(lerp(col[0] * kk * ink, HAZE[0], fade), lerp(col[1] * kk * ink, HAZE[1], fade), lerp(col[2] * kk * ink, HAZE[2], fade));
        b.fillText(glyph, c * cw + cw / 2, r * ch + ch / 2 + ch * 0.06);
      };
      art.forEach((line, j) => {
        const r = row - (tall - 1 - j);
        for (let q = 0; q < wide; q++) {
          const t = line[q];
          if (t === " ") continue;
          const c = c0 + q, side = 0.82 + 0.3 * (q / wide);        // the moon is to the right: that side is brighter
          if (t === "U") { cell(c, r, TRUNK, 1, "|", 2); continue; }
          // dark boughs, with snow on the tip and along the edge that faces the
          // moon, and the odd patch elsewhere
          const edge = line[q + 1] !== "F", fh = hash(q, j, seed);
          if (j === 0 || (edge && fh < 0.75) || fh < 0.1) {
            const f = clamp(side - 0.4 + (edge ? 0.2 : 0), 0, 1);
            cell(c, r, [lerp(TREE_SNOW_SHADE[0], TREE_SNOW[0], f), lerp(TREE_SNOW_SHADE[1], TREE_SNOW[1], f), lerp(TREE_SNOW_SHADE[2], TREE_SNOW[2], f)], 1, "^", 0.7);
          } else cell(c, r, FIR, side, "^", 1.9);
        }
      });
    };

    HILLS.forEach((hl, k) => {
      for (let c = 0; c < cols; c++)
        for (let r = Math.max(0, Math.floor(ridge(hl, k, (c + 0.5) * cw) / ch)); r < rows; r++)
          if ((r + 0.5) * ch >= ridge(hl, k, (c + 0.5) * cw)) ground(hl, k, c, r);

      // Forest. One rank of firs at a time, walking along the ridge and planting
      // them shoulder to shoulder; a slow noise leaves clearings so it grows in
      // woods and not as a hedge. `down` is how many rows below the ridge line
      // the rank stands: further down the slope is nearer, so less faded.
      const haze = k === 0 ? 0.55 : k === 1 ? 0.3 : 0;
      const rank = (kinds, down, gap, spread, dim, bare) => {
        for (let c = -3; c < cols; c += gap + ((rnd() * spread) | 0)) {
          const art = FIRS[kinds[(rnd() * kinds.length) | 0]], wide = art[0].length;
          if (noise1((c * cw) / 190 + down * 3.1, SEED + 60 + k) < bare) continue;
          const row = Math.floor(ridge(hl, k, (c + wide / 2) * cw) / ch) + 1 + down + ((rnd() * 2) | 0);
          stamp(art, c, row, Math.min(0.9, haze + dim), (rnd() * 1e6) | 0);
        }
      };
      if (k === 0) {
        rank(["firTiny", "firSpike", "firTiny"], -1, 1, 2, 0.1, 0.24);   // a far treeline along the skyline
        rank(["firTiny", "firSpike"], 1, 1, 3, 0, 0.34);
      } else if (k === 1) {
        rank(["firSmall", "firSlim", "firSmall"], -1, 2, 2, 0.2, 0.26);
        rank(["firSmall", "firSlim"], 0, 2, 2, 0.12, 0.3);
        rank(["firSmall", "firSlim"], 2, 2, 3, 0.05, 0.36);
        rank(["firSmall"], 5, 2, 3, 0, 0.44);
      } else {
        rank(["fir", "firTall", "firSlim"], -1, 3, 2, 0.26, 0.26);
        rank(["fir", "firTall", "firSlim", "fir"], 0, 3, 2, 0.16, 0.3);
        rank(["fir", "firTall", "firSmall"], 3, 3, 3, 0.07, 0.38);
        rank(["fir", "firSmall", "firTall"], 6, 3, 4, 0, 0.46);
      }
    });
    b.setTransform(1, 0, 0, 1, 0, 0);
    b.strokeStyle = GRID;
    b.lineWidth = 1;
    b.beginPath();
    for (let c = 0; c <= this.cols; c++) {
      const x = Math.round(c * this.cw * dpr) + 0.5;

    for (let r = 0; r <= this.rows; r++) {

  },

  cellIndex(x, y) {
    const c = Math.floor(x / this.cw), r = Math.floor(y / this.ch);

  // Wood colour for a brightness between 0 (underside) and 1 (lit top).

  },

  snowTone(f) {
    return pack(lerp(SNOW_SHADE[0], SNOW[0], f), lerp(SNOW_SHADE[1], SNOW[1], f), lerp(SNOW_SHADE[2], SNOW[2], f));
  },

  // Rasterize one limb: each segment is a tapered capsule. A cell inside it is

  // heaped above it.
  drawLimb(l) {

            if (lerp(sa, sb, j / steps) < 0.5) continue;
            const i = this.cellIndex(lerp(ax, bx, j / steps), lerp(ay, by, j / steps) - ch);
            if (i < 0) continue;
            this.flag[i] = 1;
            this.fill[i] = this.snowTone(0.8);
            this.glyph[i] = 46;
            this.colour[i] = this.snowTone(0.1);
          }
        }
        for (let j = 0; j <= steps; j++) {
          const i = this.cellIndex(lerp(ax, bx, j / steps), lerp(ay, by, j / steps));
          if (i < 0) continue;
          this.flag[i] = 1;
          this.glyph[i] = dirGlyph(l.a[k]);

      const r0 = Math.max(0, Math.floor((Math.min(ay, by) - ra - heap) / ch)), r1 = Math.min(rows - 1, Math.floor((Math.max(ay, by) + ra) / ch));

            const f = clamp((dist - (rad - depth * 0.35)) / depth, 0, 1);   // 0 against the bark, 1 at the crest
            this.flag[i] = 1;

              this.glyph[i] = hash(c, r, 4) < 0.5 ? 46 : 58;
              this.colour[i] = this.snowTone(1);
            } else {
              this.fill[i] = this.snowTone(0.25 + 0.75 * f);
              this.glyph[i] = hash(c, r, 4) < 0.7 ? 46 : 58;
              this.colour[i] = this.snowTone(0.25 + 0.75 * f - 0.3);

            this.fill[i] = this.bark(lum) || 1;
            this.glyph[i] = RAMP.charCodeAt(clamp(Math.floor((1 - lum) * RAMP.length) + jitter, 0, RAMP.length - 1));
            this.colour[i] = this.bark(lum, 0.5);

  },

  // Berries: each one is a single red cell, hanging in a loose bunch that
  // swings a little with the twig.
  drawBerries(g) {
    const { cw, ch } = this;

      const l = b.limb;
      const x0 = l.x[b.at] + Math.sin(time * 1.3 + b.ph) * g * 2.5, y0 = l.y[b.at];

  // Falling snow. Far flakes are small dim dots that anything can cover; near

  drawFlakes(front) {

      if (f.z >= 0.6 !== front) continue;

      if (i < 0) continue;

        if (!this.flag[i]) { this.flag[i] = 1; this.fill[i] = 0; }
        this.glyph[i] = f.z > 0.78 ? 42 : 0xb7;                    // * and ·
        this.colour[i] = pack(FLAKE[0] + 20, FLAKE[1] + 16, FLAKE[2]);

    if (!front) return;
    for (const p of puffs) {
      const i = this.cellIndex(p.x, p.y);
      if (i < 0) continue;
      if (!this.flag[i]) { this.flag[i] = 1; this.fill[i] = 0; }
      this.glyph[i] = p.life > 0.5 ? 42 : 46;
      this.colour[i] = pack(SNOW[0], SNOW[1], SNOW[2]);

  // Rasterize a tapered capsule (or a disc, if both ends coincide) and hand
  // every covered cell to `paint`, with its offset from the centre line.
  capsule(ax, ay, bx, by, ra, rb, paint) {
    const { cw, ch, cols, rows } = this;
    const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy || 1;
    const ang = Math.atan2(dy, dx), rm = Math.max(ra, rb);
    if (rm < ch * 0.6) {
      // too thin to reliably cover cell centres: walk the line instead
      const steps = Math.max(1, Math.ceil(Math.sqrt(len2) / (cw * 0.5)));
      for (let j = 0; j <= steps; j++) {
        const i = this.cellIndex(ax + (dx * j) / steps, ay + (dy * j) / steps);
        if (i >= 0) paint.call(this, i, 0, 0, 0, rm, ang, true);
      }
      return;
    }
    const c0 = Math.max(0, Math.floor((Math.min(ax, bx) - rm) / cw)), c1 = Math.min(cols - 1, Math.floor((Math.max(ax, bx) + rm) / cw));
    const r0 = Math.max(0, Math.floor((Math.min(ay, by) - rm) / ch)), r1 = Math.min(rows - 1, Math.floor((Math.max(ay, by) + rm) / ch));
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        const x = c * cw + cw / 2, y = r * ch + ch / 2;
        const t = clamp(((x - ax) * dx + (y - ay) * dy) / len2, 0, 1);
        const ex = x - (ax + dx * t), ey = y - (ay + dy * t);

      }
    }
  },

  // Fur: lit from above, cream on the side that faces away from the back.
  pCol: FUR, pBelly: false, pDim: 1,
  paintFur(i, ex, ey, dist, rad, ang, thin) {
    const col = !thin && this.pBelly && ex * sq.bkx + ey * sq.bky < -0.5 * rad ? BELLY : this.pCol;
    const lum = thin ? 0.75 : clamp((0.72 - 0.28 * (ey / rad)) * (1 - 0.2 * (dist / rad) * (dist / rad)), 0, 1);
    const k = this.pDim * (0.5 + 0.5 * lum);
    const tone = pack(col[0] * k, col[1] * k, col[2] * k);
    this.flag[i] = 1;
    if (!thin && rad - dist < this.cw * 0.3) {
      this.fill[i] = 0;                                            // rim: bare character
      this.glyph[i] = RAMP.charCodeAt(clamp(Math.floor(lum * RAMP.length), 0, RAMP.length - 1));
      this.colour[i] = tone;
    } else {
      this.fill[i] = tone || 1;
      this.glyph[i] = thin ? dirGlyph(ang) : RAMP.charCodeAt(clamp(Math.floor((1 - lum) * RAMP.length) + ((hash(i, 0, 3) * 3) | 0) - 1, 0, RAMP.length - 1));
      this.colour[i] = pack(col[0] * k * 0.5, col[1] * k * 0.5, col[2] * k * 0.5);
    }
  },

  // Tail: a see-through fringe of hairs splaying outward, then a solid core
  // painted over the middle of it.
  paintFringe(i, ex, ey, dist, rad, ang, thin) {
    const off = Math.cos(ang) * ey - Math.sin(ang) * ex;
    this.flag[i] = 1;
    this.glyph[i] = dirGlyph(ang + Math.sign(off) * 0.6);
    this.colour[i] = pack(TAIL_FRINGE[0] * 0.9, TAIL_FRINGE[1] * 0.9, TAIL_FRINGE[2] * 0.9);
    this.fill[i] = !thin && rad - dist < this.cw * 0.3 ? 0 : pack(lerp(TAIL_FRINGE[0], BG[0], 0.5), lerp(TAIL_FRINGE[1], BG[1], 0.5), lerp(TAIL_FRINGE[2], BG[2], 0.5));
  },
  paintCore(i, ex, ey, dist, rad, ang) {
    const k = 0.95 - 0.2 * (dist / rad);
    this.flag[i] = 1;
    this.fill[i] = pack(TAIL[0] * k, TAIL[1] * k, TAIL[2] * k);
    this.glyph[i] = dirGlyph(ang);
    this.colour[i] = pack(TAIL[0] * 0.5, TAIL[1] * 0.5, TAIL[2] * 0.5);
  },

  // A perched bullfinch: stamp the hand-drawn pattern, bottom row sitting on
  // the cell above the twig. It only ever moves by whole cells, so it stays
  // crisp while the twig sways under it.
  drawPerched(b) {
    const { cw, ch, cols, rows } = this;
    const art = birdArt(b);
    const breast = b.male ? BREAST_M : BREAST_F;
    const c0 = Math.floor(b.tx / cw), r0 = Math.floor(b.ty / ch) - 1 - (b.up ? 1 : 0);
    for (let j = 0; j < art.length; j++) {
      const r = r0 - (art.length - 1 - j);
      if (r < 0 || r >= rows) continue;
      for (let q = 0; q < 14; q++) {
        const t = art[j].charCodeAt(q);
        if (t === 32) continue;
        const c = c0 + b.face * (q - 7);
        if (c < 0 || c >= cols) continue;
        const i = r * cols + c;
        const dark = t === 75 || t === 69;                         // K, E
        const col = dark ? CAP : t === 82 ? breast : t === 87 ? WHITE : BILL;
        const k = dark ? 1.12 - 0.04 * j : t === 82 ? 1.08 - 0.045 * j : 1;   // a little lighter toward the top
        this.flag[i] = 1;
        this.fill[i] = pack(col[0] * k, col[1] * k, col[2] * k) || 1;
        if (t === 66 || t === 86) {                                // B, V: the bill
          this.glyph[i] = t === 86 ? 118 : b.face > 0 === (art !== PERCHED.look) ? 62 : 60;   // v, > or <
          this.colour[i] = pack(WHITE[0], WHITE[1], WHITE[2]);
        } else if (t === 69) {
          this.glyph[i] = 0x2022;                                  // • the eye, as a glint in the cap
          this.colour[i] = pack(WHITE[0], WHITE[1], WHITE[2]);
        } else {
          this.glyph[i] = hash(q, j, 6) < 0.6 ? 46 : 58;           // fixed per cell of the drawing, so it never crawls
          this.colour[i] = dark ? pack(CAP_INK[0], CAP_INK[1], CAP_INK[2]) : pack(col[0] * k * 0.6, col[1] * k * 0.6, col[2] * k * 0.6);
        }
      }
    }
  },

  // A bullfinch in flight is built in its own coordinates (x toward the bill,
  // y up) from a few overlapping shapes; each cell takes the colour of the
  // topmost shape it falls in and of where on that shape it is.
  drawBird(b) {
    if (b.mode !== "fly") return this.drawPerched(b);
    const { cw, ch, cols, rows } = this;
    const B = birdSize(), f = b.face;
    const breast = b.male ? BREAST_M : BREAST_F;
    const b0x = -0.5 * B, b0y = 0, b1x = 0.4 * B, b1y = 0, br = 0.75 * B;
    const hx = 0.95 * B, hy = 0.3 * B, hr = 0.55 * B;
    const t0x = -0.9 * B, t0y = 0, t1x = -2 * B, t1y = 0.05 * B;
    let w0x = 0.1 * B, w0y = 0.25 * B, w1x = -0.9 * B, w1y = 0.05 * B, wr0 = 0.45 * B, wr1 = 0.25 * B;   // wings shut
    if (b.flapping) {
      const up = Math.sin(b.flap * TAU) > 0;
      w0x = 0; w0y = up ? 0.3 * B : -0.2 * B; w1x = -0.35 * B; w1y = up ? 1.9 * B : -1.7 * B; wr0 = 0.55 * B; wr1 = 0.2 * B;
    }
    const c0 = Math.max(0, Math.floor((b.x - 2.5 * B) / cw)), c1 = Math.min(cols - 1, Math.floor((b.x + 2.5 * B) / cw));
    const r0 = Math.max(0, Math.floor((b.y - 2.3 * B) / ch)), r1 = Math.min(rows - 1, Math.floor((b.y + 2.1 * B) / ch));
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        const lx = (c * cw + cw / 2 - b.x) * f, ly = b.y - (r * ch + ch / 2);
        let col = null, dark = false;
        const dx = lx - hx, dy = ly - hy;
        if (dx * dx + dy * dy <= hr * hr) {
          dark = dy > 0 || (dx > 0.3 * hr && dy > -0.45 * hr);     // black cap and face, coloured cheek below
          col = dark ? CAP : breast;
        } else if (inCapsule(lx, ly, w0x, w0y, w1x, w1y, wr0, wr1) >= 0) {
          dark = true; col = CAP;
        } else if (inCapsule(lx, ly, b0x, b0y, b1x, b1y, br, br) >= 0) {
          if (lx < -0.55 * B && ly > -0.2 * B) col = WHITE;        // rump
          else if (ly > 0.3 * B && lx < 0.35 * B) { dark = true; col = CAP; }
          else col = breast;
        } else if (inCapsule(lx, ly, t0x, t0y, t1x, t1y, 0.32 * B, 0.22 * B) >= 0) {
          dark = true; col = CAP;
        } else continue;
        const k = clamp(1 + 0.14 * (ly / B), 0.8, 1.15), i = r * cols + c;
        this.flag[i] = 1;
        this.fill[i] = pack(col[0] * k, col[1] * k, col[2] * k) || 1;
        this.glyph[i] = 46;
        this.colour[i] = dark ? pack(CAP_INK[0], CAP_INK[1], CAP_INK[2]) : pack(col[0] * k * 0.6, col[1] * k * 0.6, col[2] * k * 0.6);
      }
    }
    const i = this.cellIndex(b.x + f * (hx + hr * 1.1), b.y - (hy - 0.1 * hr));
    if (i >= 0) {
      this.flag[i] = 1;
      this.fill[i] = pack(BILL[0], BILL[1], BILL[2]);
      this.glyph[i] = f > 0 ? 62 : 60;                             // > or <
      this.colour[i] = pack(WHITE[0], WHITE[1], WHITE[2]);
    }
  },

  drawSquirrel() {
    if (!sq.on) return;
    const S = sq.size, fur = this.paintFur;
    const drawLeg = (g, thigh) => {
      this.capsule(g[0], g[1], g[2], g[3], thigh * S, 0.045 * S, fur);
      this.capsule(g[2], g[3], g[4], g[5], 0.045 * S, 0.035 * S, fur);
    };

    // far legs, in shadow
    this.pCol = FUR_FAR; this.pBelly = false; this.pDim = 1;
    drawLeg(sq.legs[0], 0.05); drawLeg(sq.legs[1], 0.07);

    // tail: bushiest a third of the way along
    const tw = (u) => S * (0.06 + 0.11 * Math.sin(Math.PI * Math.pow(u, 0.6)));
    for (let k = 0; k < NT; k++) this.capsule(sq.tx[k], sq.ty[k], sq.tx[k + 1], sq.ty[k + 1], tw(k / NT), tw((k + 1) / NT), this.paintFringe);
    for (let k = 0; k < NT; k++) this.capsule(sq.tx[k], sq.ty[k], sq.tx[k + 1], sq.ty[k + 1], tw(k / NT) * 0.55, tw((k + 1) / NT) * 0.55, this.paintCore);

    // body: a curve from hips to shoulders, heavier at the haunches
    this.pCol = FUR; this.pBelly = true;
    let px = sq.hipx, py = sq.hipy;
    for (let j = 1; j <= 6; j++) {
      const t = j / 6, a = (1 - t) * (1 - t), b = 2 * t * (1 - t), c = t * t;
      const x = a * sq.hipx + b * sq.cx + c * sq.shx, y = a * sq.hipy + b * sq.cy + c * sq.shy;
      this.capsule(px, py, x, y, S * (0.2 - 0.055 * Math.pow((j - 1) / 6, 1.5)), S * (0.2 - 0.055 * Math.pow(t, 1.5)), fur);
      px = x; py = y;
    }
    this.capsule(sq.shx, sq.shy, sq.hx, sq.hy, 0.145 * S, 0.13 * S, fur);       // neck
    this.capsule(sq.hx, sq.hy, sq.hx, sq.hy, 0.14 * S, 0.14 * S, fur);          // head
    this.capsule(sq.hx, sq.hy, sq.snx, sq.sny, 0.1 * S, 0.045 * S, fur);        // snout
    this.pBelly = false;
    this.capsule(sq.e0x, sq.e0y, sq.e1x, sq.e1y, 0.055 * S, 0.03 * S, fur);     // ear

    // near legs
    this.pDim = 0.92;
    drawLeg(sq.legs[2], 0.06); drawLeg(sq.legs[3], 0.12);

    const i = this.cellIndex(sq.eyex, sq.eyey);
    if (i >= 0) {
      this.flag[i] = 1;
      this.fill[i] = pack(FUR[0] * 0.85, FUR[1] * 0.85, FUR[2] * 0.85);
      this.glyph[i] = 0x25cf;                                      // ●
      this.colour[i] = pack(EYE[0], EYE[1], EYE[2]);
    }
  },

  render() {
    const { ctx, dpr, cols, cw, ch } = this;
    const g = gust();
    this.flag.fill(0);
    this.drawFlakes(false);                                        // distant snow, behind everything
    for (let i = limbs.length - 1; i >= 0; i--) this.drawLimb(limbs[i]);   // twigs first, the main limb on top
    this.drawBerries(g);
    this.drawSquirrel();
    for (const b of birds) if (b.on) this.drawBird(b);
    this.drawFlakes(true);                                         // snow falling in front

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(this.bg, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // one character per occupied cell
    ctx.font = `600 ${Math.round(ch * 0.78)}px ${this.font}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    let lastStyle = "";
    for (let i = 0; i < this.flag.length; i++) {
      if (!this.flag[i]) continue;
      const x = (i % cols) * cw, y = ((i / cols) | 0) * ch;
      if (this.fill[i]) {
        const fs = css(this.fill[i]);
        if (fs !== lastStyle) ctx.fillStyle = lastStyle = fs;
        ctx.fillRect(x + 1, y + 1, cw - 1, ch - 1);
      }
      const gs = css(this.colour[i]);
      if (gs !== lastStyle) ctx.fillStyle = lastStyle = gs;
      ctx.fillText(String.fromCharCode(this.glyph[i]), x + cw / 2, y + ch / 2 + ch * 0.06);
    }
  },
};

// ---------- boot ----------
const canvas = document.querySelector("canvas");
renderer.canvas = canvas;
renderer.ctx = canvas.getContext("2d", { alpha: false });
renderer.bg = document.createElement("canvas");
renderer.font = getComputedStyle(canvas).fontFamily || "monospace";

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  if (w < 1 || h < 1) return;
  W = w; H = h;
  renderer.resize(w, h, Math.min(window.devicePixelRatio || 1, 2));
  build();
  pose();
  renderer.render();
}

// Frames drawn per second; override with ?fps=20 etc.
const FPS = clamp(Number(params.get("fps")) || 30, 5, 120);
const still = window.matchMedia("(prefers-reduced-motion: reduce)");
let last = 0;

function tick(dt) {
  time += dt;
  pose();
  stepSnow(dt);
  stepSquirrel(dt);
  stepBirds(dt);
}

function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 1000 / FPS - 2) return;                         // not time for the next frame yet
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  tick(dt);
  renderer.render();
}

window.addEventListener("resize", resize);
resize();
// ?t=20 starts the scene 20 seconds in
for (let i = 0, n = Math.round((Number(params.get("t")) || 0) * 30); i < n; i++) tick(1 / 30);
renderer.render();
if (!still.matches) {
  last = performance.now();
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
