<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ascii scenes</title>
<style>
  html, body { margin: 0; height: 100%; background: #06070c; overflow: hidden; }
  canvas {
    display: block; width: 100vw; height: 100vh;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  nav a {
    position: absolute; display: block; overflow: hidden; color: transparent; outline: none;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<nav aria-label="Scenes">
  <a href="koi.html">Koi pond</a>
  <a href="branch.html">Winter branch</a>
  <a href="station.html">Orbital station</a>
  <a href="depot.html">Freight depot</a>
</nav>
<script>
"use strict";

// ---------- small helpers ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);

function hash(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1274126177)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function noise2(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const u = smooth(x - xi), v = smooth(y - yi);
  return lerp(
    lerp(hash(xi, yi, s), hash(xi + 1, yi, s), u),
    lerp(hash(xi, yi + 1, s), hash(xi + 1, yi + 1, s), u),
    v
  );
}
const noise1 = (x, s) => noise2(x, 0, s);
const pack = (r, g, b) => (clamp(r | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(b | 0, 0, 255);
const cssCache = new Map();
function css(c) {
  let s = cssCache.get(c);
  if (!s) { s = `rgb(${c >>> 16},${(c >>> 8) & 255},${c & 255})`; cssCache.set(c, s); }
  return s;
}

const params = new URLSearchParams(location.search);
const BG = [6, 7, 12];
const TEX = "#%&@$8B0";                                             // glyphs printed on solid cells

// ---------- the character grid ----------
let W = 0, H = 0, cols = 0, rows = 0, cw = 6, ch = 9, dpr = 1, time = 0;
let flag, glyph, colour, fill;                                      // flag: 1 = bare glyph, 2 = solid block
let K = { x: 0, y: 0, w: 0, h: 0 };                                 // the rectangle being drawn into
const whole = () => { K = { x: 0, y: 0, w: cols, h: rows }; };

function put(x, y, g, r, gg, b) {
  x = Math.floor(x); y = Math.floor(y);
  if (x < 0 || y < 0 || x >= K.w || y >= K.h) return;
  const i = (K.y + y) * cols + K.x + x;
  if (flag[i] === 2) return;                                        // never punch a hole in something solid
  flag[i] = 1; glyph[i] = g; colour[i] = pack(r, gg, b);
}
function blk(x, y, r, g, b) {
  x = Math.floor(x); y = Math.floor(y);
  if (x < 0 || y < 0 || x >= K.w || y >= K.h) return;
  const i = (K.y + y) * cols + K.x + x;
  flag[i] = 2; fill[i] = pack(r, g, b);
  glyph[i] = TEX.charCodeAt((hash(x, y, 5) * TEX.length) | 0);
  colour[i] = pack(r * 0.62, g * 0.62, b * 0.62);
}
// a filled circle; cells are half again as tall as they are wide. fn(u, v, x, y) gives the colour
function disc(cx, cy, rad, fn) {
  const y0 = Math.max(0, Math.floor(cy - rad / 1.5)), y1 = Math.min(K.h - 1, Math.ceil(cy + rad / 1.5));
  const x0 = Math.max(0, Math.floor(cx - rad)), x1 = Math.min(K.w - 1, Math.ceil(cx + rad));
  for (let y = y0; y <= y1; y++)
    for (let x = x0; x <= x1; x++) {
      const dx = x + 0.5 - cx, dy = (y + 0.5 - cy) * 1.5;
      if (dx * dx + dy * dy > rad * rad) continue;
      const c = fn(dx / rad, dy / rad, x, y);
      if (c) blk(x, y, c[0], c[1], c[2]);
    }
}
function stars(seed, density) {
  for (let y = 0; y < K.h; y++)
    for (let x = 0; x < K.w; x++) {
      const s = hash(x, y, seed);
      if (s > density) continue;
      const k = 0.55 + 0.45 * Math.sin(time * (1 + s * 300) + x);
      put(x, y, s < density * 0.3 ? 43 : 46, 150 * k, 160 * k, 190 * k);
    }
}

// ---------- block lettering ----------
const FONT = {
  A: ["111", "101", "111", "101", "101"], B: ["110", "101", "110", "101", "110"],
  C: ["111", "100", "100", "100", "111"], D: ["110", "101", "101", "101", "110"],
  E: ["111", "100", "110", "100", "111"], F: ["111", "100", "110", "100", "100"],
  G: ["111", "100", "101", "101", "111"], H: ["101", "101", "111", "101", "101"],
  I: ["111", "010", "010", "010", "111"], K: ["101", "101", "110", "101", "101"],
  L: ["100", "100", "100", "100", "111"], N: ["1001", "1101", "1011", "1001", "1001"],
  O: ["111", "101", "101", "101", "111"], P: ["111", "101", "111", "100", "100"],
  R: ["110", "101", "110", "101", "101"], S: ["111", "100", "111", "001", "111"],
  T: ["111", "010", "010", "010", "010"], W: ["10001", "10001", "10101", "10101", "01010"],
  " ": ["00", "00", "00", "00", "00"],
};
function textWidth(str, sx) {
  let n = -1;
  for (const c of str) n += FONT[c][0].length + 1;
  return n * sx;
}
function text(str, x, y, sx, sy, r, g, b) {
  for (const c of str) {
    const f = FONT[c];
    for (let j = 0; j < 5; j++)
      for (let i = 0; i < f[j].length; i++)
        if (f[j][i] === "1")
          for (let b2 = 0; b2 < sy; b2++)
            for (let a = 0; a < sx; a++) blk(x + i * sx + a, y + j * sy + b2, r, g, b);
    x += (f[0].length + 1) * sx;
  }
}

// ---------- the four little scenes ----------
const FISH = [
  { c: [240, 122, 40], p: [246, 240, 228], ph: 0 },
  { c: [244, 240, 230], p: [214, 60, 44], ph: 9.3 },
  { c: [236, 176, 60], p: [240, 122, 40], ph: 21.7 },
];
const PROFILE = [0.55, 0.85, 1, 1, 0.9, 0.75, 0.58, 0.42, 0.3, 0.55];
const PADS = [[0.15, 0.27, 0.17, 0.6], [0.84, 0.72, 0.2, 2.4], [0.7, 0.18, 0.12, 4.1], [0.3, 0.83, 0.13, 5.2]];

function koi(t) {
  const { w, h } = K;
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      const n = noise2(x * 0.07 + t * 0.06, y * 0.28 - t * 0.04, 11);
      if (n > 0.6) { const k = (n - 0.6) * 2.5; put(x, y, n > 0.72 ? 126 : 45, 20 + 50 * k, 60 + 90 * k, 80 + 90 * k); }
    }
  const R = h * 0.1;
  for (let f = 0; f < 3; f++) {
    const F = FISH[f];
    for (let k = 9; k >= 0; k--) {                                   // tail first, head on top
      const s = t * 0.5 + F.ph - k * 0.24;
      const px = w * (0.5 + 0.3 * Math.sin(s * 0.23 + f * 2.1) + 0.14 * Math.sin(s * 0.61 + f));
      const py = h * (0.5 + 0.28 * Math.sin(s * 0.31 + f * 1.3) + 0.12 * Math.cos(s * 0.53 + f * 4));
      let c = hash(k, f, 3) > 0.55 ? F.p : F.c;
      if (k === 9) c = [lerp(c[0], 255, 0.4), lerp(c[1], 240, 0.4), lerp(c[2], 220, 0.4)];
      disc(px, py, R * PROFILE[k], () => c);
    }
  }
  for (const [fx, fy, fr, notch] of PADS)
    disc(w * fx + Math.sin(t * 0.4 + notch) * 0.6, h * fy, h * fr, (u, v, x, y) => {
      let a = Math.atan2(v, u) - notch;
      a = Math.abs(a - TAU * Math.round(a / TAU));
      const d = u * u + v * v;
      if (a < 0.3 && d > 0.04) return null;
      const k = (0.82 + 0.26 * hash(x, y, 12)) * (d > 0.7 ? 0.72 : 1);
      return [44 * k, 124 * k, 72 * k];
    });
}

function branch(t) {
  const { w, h } = K, s = h / 29;
  for (let y = 0; y < h * 0.6; y++)
    for (let x = 0; x < w; x++) if (hash(x, y, 21) < 0.008) put(x, y, 46, 120, 130, 160);
  disc(w * 0.82, h * 0.24, h * 0.2, (u, v, x, y) => {
    const k = 0.9 + 0.1 * hash(x, y, 22) - (hash(x >> 1, y, 23) > 0.85 ? 0.12 : 0);
    return [226 * k, 230 * k, 244 * k];
  });
  const far = (x) => h * (0.64 + 0.1 * noise1(x * 0.045, 24));
  for (let x = 0; x < w; x++)
    for (let y = Math.ceil(far(x)); y < h; y++) blk(x, y, 24, 34, 62);
  for (let x = 0; x < w; x++) {                                      // firs along the far ridge
    if (hash(x, 0, 26) > 0.16) continue;
    const ht = Math.round((3 + hash(x, 1, 26) * 3) * s), top = Math.ceil(far(x)) - ht + 1;
    for (let j = 0; j < ht; j++)
      for (let i = -Math.round(j * 0.6); i <= Math.round(j * 0.6); i++) {
        const k = 0.8 + 0.4 * hash(x + i, j, 29);
        blk(x + i, top + j, 18 * k, 46 * k, 48 * k);
      }
  }
  for (let x = 0; x < w; x++) {
    const t2 = Math.ceil(h * (0.82 + 0.09 * noise1(x * 0.08 + 5, 25)));
    for (let y = t2; y < h; y++) y === t2 ? blk(x, y, 168, 182, 214) : blk(x, y, 70, 84, 122);
  }
  // the branch, with snow lying along the top
  const xEnd = Math.round(w * 0.8), top = [];
  for (let x = 0; x <= xEnd; x++) {
    const f = x / xEnd, yc = h * (0.56 - 0.14 * f) + Math.sin(x * 0.13) * 0.7 * s;
    const th = lerp(2.8, 0.8, f) * s, y0 = Math.round(yc - th / 2), y1 = Math.max(y0, Math.round(yc + th / 2) - 1);
    for (let y = y0; y <= y1; y++) { const k = 0.8 + 0.3 * hash(x, y, 27); blk(x, y, 96 * k, 66 * k, 50 * k); }
    if (hash(x, 1, 27) > 0.12) blk(x, y0 - 1, 232, 238, 250);
    top[x] = y0 - 1;
  }
  for (const [fx, n] of [[0.24, 6], [0.62, 5]]) {
    const x0 = Math.round(w * fx), yb = top[x0];
    for (let j = 1; j <= Math.round(n * s); j++) { blk(x0 + j, yb - j + 1, 84, 58, 44); blk(x0 + j, yb - j, 232, 238, 250); }
  }
  // a bullfinch that hops now and then
  const bx = Math.round(w * 0.44), r = h * 0.15, ph = t % 6;
  const lift = ph < 0.4 ? Math.sin(ph / 0.4 * Math.PI) * 1.5 : 0;
  const cy = top[bx] - r / 1.5 + 0.6 - lift;
  for (let j = 1; j <= 3; j++) blk(bx - r - j + 1, cy + j * 0.45, 30, 30, 40);
  disc(bx, cy, r, (u, v) => (u + 0.5 * v > -0.15 ? [226, 84, 60] : [124, 134, 154]));
  const hx = bx + 0.6 * r, hy = cy - 0.8 * r / 1.5;
  disc(hx, hy, 0.62 * r, (u, v) => (v < 0.15 ? [28, 28, 36] : [226, 84, 60]));
  blk(hx + 0.62 * r + 0.4, hy, 70, 70, 78);
  for (let i = 0; i < 46; i++) {
    const sp = 2 + hash(i, 0, 28) * 3;
    const x = (hash(i, 1, 28) * w + Math.sin(t * 0.7 + i) * 1.5 + t * 1.2) % w;
    put(x, (hash(i, 2, 28) * h + t * sp) % h, i % 3 ? 46 : 42, 220, 228, 245);
  }
}

// a banded planet with rings; opts: centre, radius, ring tilt and squash, ring radii, colours
function planet(t, cx, cy, Rp, T, sq, r0, r1, gap, ca, cb, cr) {
  const { w, h } = K, cT = Math.cos(T), sT = Math.sin(T);
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      const dx = x + 0.5 - cx, dy = (y + 0.5 - cy) * 1.5, d2 = (dx * dx + dy * dy) / (Rp * Rp);
      const ex = (dx * cT + dy * sT) / Rp, ey = (-dx * sT + dy * cT) / Rp, rr = Math.hypot(ex, ey / sq);
      if (rr > r0 && rr < r1 && !(rr > gap && rr < gap + 0.09) && (ey > 0 || d2 > 1)) {
        const k = 0.62 + 0.38 * noise1(rr * 9, 31);
        blk(x, y, cr[0] * k, cr[1] * k, cr[2] * k);
        continue;
      }
      if (d2 >= 1) continue;
      const lam = Math.max(0, (dx * 0.55 - dy * 0.45) / Rp + Math.sqrt(1 - d2) * 0.7);
      const band = clamp(noise1(ey * 7 + 20, 32) * 0.75 + 0.35 * noise2(ex * 3 + t * 0.05, ey * 14, 33) - 0.05, 0, 1);
      const k = 0.07 + 1.05 * lam;
      blk(x, y, lerp(ca[0], cb[0], band) * k, lerp(ca[1], cb[1], band) * k, lerp(ca[2], cb[2], band) * k);
    }
}

function station(t) {
  const { w, h } = K;
  stars(41, 0.014);
  planet(t, w * 0.3, h * 0.6, h * 0.5, -0.32, 0.3, 1.3, 2.25, 1.74, [222, 176, 112], [150, 94, 58], [206, 184, 148]);
  const sx = Math.round(w * 0.76), sy = Math.round(h * 0.34), rw = h * 0.26, ry = rw * 0.5 / 1.5;
  const rim = (near) => {
    for (let i = 0; i < 40; i++) {
      const a = i / 40 * TAU + t * 0.3, sn = Math.sin(a);
      if ((sn >= 0) !== near) continue;
      const k = near ? 1 : 0.6;
      if (i % 8 === 0) blk(sx + 0.5 + Math.cos(a) * rw, sy + 0.5 + sn * ry, 255 * k, 200 * k, 110 * k);
      else blk(sx + 0.5 + Math.cos(a) * rw, sy + 0.5 + sn * ry, 178 * k, 184 * k, 200 * k);
    }
  };
  rim(false);
  const arm = Math.round(h * 0.17);
  for (let j = -arm; j <= arm; j++) blk(sx, sy + j, 150, 156, 170);
  for (const e of [-arm - 1, arm + 1])
    for (let i = -4; i <= 4; i++) if (i) blk(sx + i, sy + e, 44, 84 + 20 * (i & 1), 176);
  for (let j = 0; j < 4; j++) {
    const a = t * 0.3 + j * TAU / 4;
    for (let q = 0.25; q < 0.9; q += 0.2) put(sx + 0.5 + Math.cos(a) * rw * q, sy + 0.5 + Math.sin(a) * ry * q, 43, 130, 136, 150);
  }
  rim(true);
  blk(sx, sy, 236, 238, 244);
}

// a box seen from the front and a little above: lit top, mid front, dark side
function box(x, yb, wd, ht, D, col, win) {
  for (let k = D; k >= 0; k--)
    for (let yy = 0; yy < ht; yy++)
      for (let xx = 0; xx < wd; xx++) {
        if (k > 0 && yy < ht - 1 && xx < wd - 2) continue;
        const X = x + xx + 2 * k, Y = yb - yy - k;
        if (k === 0 && win && yy % 2 === 1 && yy < ht - 1 && hash(X, Y, 43 + Math.floor(time / 20)) < win) { blk(X, Y, 255, 196, 104); continue; }
        const tone = (k === 0 ? 0.6 : yy === ht - 1 ? 0.95 : 0.36) * (0.94 + 0.1 * hash(X, Y, 42));
        blk(X, Y, col[0] * tone, col[1] * tone, col[2] * tone);
      }
}
const CONC = [168, 172, 180], CARGO = [[226, 120, 44], [60, 160, 160], [220, 184, 70]];

function depot(t) {
  const { w, h } = K, s = h / 29, u = (v) => Math.max(1, Math.round(v * s));
  stars(51, 0.014);
  planet(t, w * 0.14, h * 0.74, h * 0.75, 0.16, 0.22, 1.2, 1.5, 1.34, [176, 218, 228], [92, 146, 190], [190, 212, 228]);
  const SX = Math.round(w * 0.32), SB = Math.round(h * 0.78), TY = SB - u(3) - 1;
  box(SX, SB, u(46), u(3), u(5), CONC);
  if (u(3) >= 3) for (let xx = 2; xx < u(46) - 2; xx++) if ((xx >> 2) & 1) blk(SX + xx, SB - 1, 226, 120, 44);
  const tx0 = SX + u(8) + 4, bx0 = SX + u(24) + 4;
  box(tx0, TY, u(9), u(13), u(3), CONC, 0.32);
  box(bx0, TY, u(14), u(6), u(3), CONC, 0.26);
  // mast and beacon on the tower, gun on the block
  const mx = tx0 + u(4) + 3, my = TY - u(13) - 1;
  for (let j = 0; j < u(3); j++) put(mx, my - j, 124, 150, 156, 170);
  if (t % 2 < 1) put(mx, my - u(3), 42, 255, 60, 52);
  const gx = bx0 + u(8), gy = TY - u(6) - 1;
  box(gx, gy, u(3), u(2), 1, [228, 230, 238]);
  for (let j = 1; j <= u(3); j++) put(gx + u(3) + j + 1, gy - u(2) - j + 1, 47, 240, 150, 60);
  // a truck comes in, unloads, and leaves
  const ph = t % 26, dock = SX + u(10), TB = SB + u(4);
  const tx = Math.round(ph < 6 ? lerp(w + 4, dock, 1 - (1 - ph / 6) ** 2) : ph < 18 ? dock : dock - ((ph - 18) / 8) ** 2 * (dock + u(30)));
  box(tx, TB, u(19), 1, 2, [118, 124, 138]);
  box(tx, TB - 1, u(4), u(2), 2, [226, 228, 236]);
  for (let i = 0; i < 3; i++)
    if (ph < 8 + i * 2) box(tx + u(5) + i * u(4.5), TB - 1, u(4), u(2), 2, CARGO[i]);
  if (ph > 18) for (let j = 0; j < 3; j++) put(tx + u(19) + 5 + j * 2, TB - 1, j ? 46 : 42, 120, 220, 255);
  // now and then a shot splashes on the shield
  const n = Math.floor(t / 9), sp = t - n * 9;
  const fx = SX + hash(n, 0, 44) * u(50), fy = h * (0.12 + 0.25 * hash(n, 1, 44));
  if (sp < 0.35) {
    const d = (1 - sp / 0.35) * 30 * s;
    for (let j = 0; j < 3; j++) put(fx + d + j, fy - (d + j) * 0.3, 45, 255, 96, 70);
  } else if (sp < 1.1) {
    const a = 1 - (sp - 0.35) / 0.75, rad = (2 + 4 * (1 - a)) * s;
    blk(fx, fy, 90 * a, 170 * a, 255 * a); blk(fx + 1, fy, 90 * a, 170 * a, 255 * a);
    for (let i = 0; i < 14; i++)
      put(fx + 1 + Math.cos(i / 14 * TAU) * rad, fy + 0.5 + Math.sin(i / 14 * TAU) * rad / 1.5, 111, 70 * a, 150 * a, 255 * a);
  }
}

const SCENES = [
  { name: "KOI", acc: [240, 132, 52], draw: koi },
  { name: "BRANCH", acc: [230, 92, 68], draw: branch },
  { name: "STATION", acc: [232, 190, 110], draw: station },
  { name: "DEPOT", acc: [110, 200, 240], draw: depot },
];
const TITLE = "ASCII SCENES";
const links = [...document.querySelectorAll("nav a")];
let hot = -1, layout = null;

// ---------- layout ----------
function plan() {
  let ts = [1, 1];
  for (const s of [[3, 2], [2, 1], [1, 1]]) if (textWidth(TITLE, s[0]) <= cols - 8) { ts = s; break; }
  const titleH = 5 * ts[1], top = 3 + titleH + 3;
  let best = null;
  for (const n of [4, 2, 1]) {
    const lines = 4 / n, cardW = Math.floor((cols - 8 - (n - 1) * 4) / n);
    const per = Math.floor((rows - top - 1) / lines);
    const h = Math.min(per - 11, Math.round((cardW - 2) / 3), 46);
    if (!best || h > best.h) best = { n, h, per };
  }
  const { n, per } = best, h = Math.max(6, best.h), w = h * 3, lines = 4 / n;
  const gap = n > 1 ? Math.min(8, Math.floor((cols - 4 - n * (w + 2)) / (n - 1))) : 0;
  const gx = Math.floor((cols - n * (w + 2) - (n - 1) * gap) / 2) + 1;
  const block = h + 11, gy = top + Math.max(0, Math.floor((rows - top - lines * block) / 2)) + 1;
  const ls = textWidth("STATION", 2) <= w ? 2 : 1;
  const cards = SCENES.map((_, i) => ({ x: gx + (i % n) * (w + 2 + gap), y: gy + Math.floor(i / n) * block, w, h }));
  layout = { ts, titleY: Math.max(1, gy - 4 - titleH), cards, ls };
  cards.forEach((c, i) => {
    const st = links[i].style;
    st.left = (c.x - 1) * cw + "px"; st.top = (c.y - 1) * ch + "px";
    st.width = (c.w + 2) * cw + "px"; st.height = (c.h + 8) * ch + "px";
  });
}

function frameBox(c, r, g, b) {
  whole();
  for (let x = c.x; x < c.x + c.w; x++) { put(x, c.y - 1, 45, r, g, b); put(x, c.y + c.h, 45, r, g, b); }
  for (let y = c.y; y < c.y + c.h; y++) { put(c.x - 1, y, 124, r, g, b); put(c.x + c.w, y, 124, r, g, b); }
  for (const [x, y] of [[c.x - 1, c.y - 1], [c.x + c.w, c.y - 1], [c.x - 1, c.y + c.h], [c.x + c.w, c.y + c.h]]) put(x, y, 43, r, g, b);
}

function draw() {
  flag.fill(0);
  whole();
  const { ts, titleY, cards, ls } = layout;
  text(TITLE, Math.floor((cols - textWidth(TITLE, ts[0])) / 2), titleY, ts[0], ts[1], 226, 224, 214);
  cards.forEach((c, i) => {
    const S = SCENES[i], on = i === hot;
    K = c;
    S.draw(time);
    on ? frameBox(c, S.acc[0], S.acc[1], S.acc[2]) : frameBox(c, 62, 68, 88);
    const col = on ? S.acc : [150, 156, 172];
    text(S.name, c.x, c.y + c.h + 2, ls, 1, col[0], col[1], col[2]);
  });
}

function render() {
  draw();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = `rgb(${BG})`;
  ctx.fillRect(0, 0, W, H);
  ctx.font = `600 ${Math.round(ch * 0.78)}px ${font}`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  let lastStyle = "";
  for (let i = 0; i < flag.length; i++) {
    if (!flag[i]) continue;
    const x = (i % cols) * cw, y = ((i / cols) | 0) * ch;
    if (flag[i] === 2) {
      const fs = css(fill[i]);
      if (fs !== lastStyle) ctx.fillStyle = lastStyle = fs;
      ctx.fillRect(x + 1, y + 1, cw - 1, ch - 1);
    }
    const gs = css(colour[i]);
    if (gs !== lastStyle) ctx.fillStyle = lastStyle = gs;
    ctx.fillText(String.fromCharCode(glyph[i]), x + cw / 2, y + ch / 2 + ch * 0.06);
  }
}

// ---------- boot ----------
const canvas = document.querySelector("canvas");
const ctx = canvas.getContext("2d", { alpha: false });
const font = getComputedStyle(canvas).fontFamily || "monospace";

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  if (w < 1 || h < 1) return;
  W = w; H = h;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  cw = clamp(Math.round(w / 260), 4, 8); ch = Math.round(cw * 1.5);
  cols = Math.ceil(w / cw); rows = Math.ceil(h / ch);
  flag = new Uint8Array(cols * rows); glyph = new Uint8Array(cols * rows);
  colour = new Uint32Array(cols * rows); fill = new Uint32Array(cols * rows);
  plan();
  render();
}

// Frames drawn per second; override with ?fps=20 etc.
const FPS = clamp(Number(params.get("fps")) || 30, 5, 120);
const still = window.matchMedia("(prefers-reduced-motion: reduce)");
let last = 0;

function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 1000 / FPS - 2) return;
  time += Math.min(0.1, (now - last) / 1000);
  last = now;
  render();
}

links.forEach((a, i) => {
  const set = (v) => () => { hot = v; if (still.matches) render(); };
  a.addEventListener("pointerenter", set(i)); a.addEventListener("focus", set(i));
  a.addEventListener("pointerleave", set(-1)); a.addEventListener("blur", set(-1));
});
window.addEventListener("pageshow", () => { hot = -1; });
window.addEventListener("resize", resize);
time = Number(params.get("t")) || 0;                                 // ?t=20 starts 20 seconds in
resize();
if (!still.matches) {
  last = performance.now();
  requestAnimationFrame(frame);
}
</script>
</body>
