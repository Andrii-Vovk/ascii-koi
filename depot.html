<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ascii freight depot</title>
<style>
  html, body { margin: 0; height: 100%; background: #04060d; overflow: hidden; }
  canvas {
    display: block; width: 100vw; height: 100vh;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
</style>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<script>
"use strict";

// ---------- small helpers ----------
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);

function hash(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1274126177)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function noise1(x, s) {
  const xi = Math.floor(x), u = smooth(x - xi);
  return lerp(hash(xi, 0, s), hash(xi + 1, 0, s), u);
}
// 2D noise that repeats every `per` units of x, so it can wrap around a planet
function pnoise(x, y, per, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const u = smooth(x - xi), v = smooth(y - yi);
  const x0 = ((xi % per) + per) % per, x1 = (x0 + 1) % per;
  return lerp(
    lerp(hash(x0, yi, s), hash(x1, yi, s), u),
    lerp(hash(x0, yi + 1, s), hash(x1, yi + 1, s), u),
    v
  );
}
function angleDiff(a, b) {
  let d = (a - b) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}
function mulberry(a) {
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pack = (r, g, b) => (clamp(r | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(b | 0, 0, 255);
const cssCache = new Map();
function css(c) {
  c &= 0xf8f8f8;
  let v = cssCache.get(c);
  if (v === undefined) cssCache.set(c, (v = `rgb(${c >>> 16},${(c >>> 8) & 255},${c & 255})`));
  return v;
}
// A line drawn at this angle looks most like which character?
function dirGlyph(a) {
  a = ((a % Math.PI) + Math.PI) % Math.PI;
  if (a < Math.PI / 8 || a >= (7 * Math.PI) / 8) return 45;   // -
  if (a < (3 * Math.PI) / 8) return 92;                        // \
  if (a < (5 * Math.PI) / 8) return 124;                       // |
  return 47;                                                   // /
}
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

// ---------- look ----------
const params = new URLSearchParams(location.search);
const SEED = Number(params.get("seed")) || 1 + ((Math.random() * 1e6) | 0);   // ?seed=123 to keep a planet
const ORBIT = clamp(Number(params.get("orbit")) || 480, 30, 36000);           // seconds for one lap around the planet
const BG = [4, 6, 13];
const NIGHT = [12, 22, 42];               // the planet's unlit side
const ATMOS = [206, 240, 255];            // haze along the sunlit limb
const STORM = [30, 52, 104];
const BANDS = [                           // cloud belts are picked from these
  [150, 206, 214], [108, 176, 196], [84, 150, 184], [190, 226, 228],
  [70, 128, 170], [128, 192, 204], [214, 236, 234], [96, 160, 190],
];
const POLE = [52, 96, 146];
const RINGS = [                           // inner edge, outer edge (planet radii), opacity, colour
  [1.22, 1.33, 0.22, [112, 124, 148]],
  [1.39, 1.86, 0.92, [210, 220, 234]],
  [1.92, 2.02, 0.50, [140, 162, 198]],
  [2.10, 2.30, 0.80, [226, 208, 214]],
  [2.38, 2.42, 0.74, [240, 242, 250]],
  [2.50, 2.54, 0.60, [170, 190, 226]],
  [2.66, 2.92, 0.28, [104, 142, 196]],
];
const MOONS = [                           // orbit radius, size (planet radii), where it starts, colour
  { r: 2.62, size: 0.030, th: 0.6, col: [200, 196, 190] },
  { r: 3.25, size: 0.058, th: 3.9, col: [214, 190, 158] },
  { r: 4.10, size: 0.044, th: 4.6, col: [176, 198, 222] },
];
const CONC = [156, 154, 148];             // raw concrete
const STEEL = [112, 118, 130];
const WINDOW = [255, 208, 120];
const GLASS = [26, 32, 46];               // an unlit window
const RIBBON = [176, 226, 255];           // the long strip windows
const BAYGLOW = [255, 170, 84];           // light inside a cargo bay
const HAZARD = [236, 190, 40];
const HAZARD_DARK = [34, 34, 38];
const PAINT = [240, 104, 48];             // stencilled numbers
const CRANE = [232, 172, 36];
const RADIATOR = [255, 92, 36];          // heat glowing in the radiator fins
const NOZZLE = [120, 180, 255];
const SHIELD = [64, 156, 255];
const PIRATE = [70, 62, 76];
const PIRATE_RED = [214, 40, 44];
const CARGO = [[186, 62, 44], [44, 104, 180], [58, 150, 92], [226, 180, 52], [222, 224, 226], [226, 118, 40], [128, 76, 160]];
const LIVERY = [[232, 96, 44], [40, 168, 168], [232, 232, 236], [214, 60, 76]];

// ---------- the planet's frame ----------
// Camera axes: x right, y down, z toward the viewer. The camera rides along
// with the station, always looking at the planet, so the sun and the stars
// wheel slowly around the scene once per orbit.
const OPEN = 26 * DEG;                    // how far the rings are tipped open toward us
const ROLL = 9 * DEG;                   // and how far the whole system leans on screen
const P = [Math.cos(OPEN) * Math.sin(ROLL), -Math.cos(OPEN) * Math.cos(ROLL), Math.sin(OPEN)];   // the pole
const E1 = [Math.cos(ROLL), Math.sin(ROLL), 0];                                                  // two axes in the ring plane
const E2 = cross(P, E1);
const CAM_RATE = TAU / ORBIT;             // our own orbital rate; everything below is relative to it
const OMEGA0 = 0.095;                     // orbital rate at one planet radius; falls off as r^-1.5
const SPIN = 0.03;                        // how fast the cloud tops turn past us
const SUN_EL = 14 * DEG;                  // the sun sits this far above the ring plane
const PHASE0 = 150 * DEG;
const RMIN = 1.2, RMAX = 3.0, RN = 900, RK = RN / (RMAX - RMIN);
const NB = 13, NX = 28;

let W = 0, H = 0, time = 0;
const G = { cx: 0, cy: 0, Rp: 1 };
const sun = [0, 0, 1];
let sunVis = 1;                           // 0 while the station is in the planet's shadow

function stepSun() {
  const a = PHASE0 - CAM_RATE * time, ce = Math.cos(SUN_EL), se = Math.sin(SUN_EL);
  for (let k = 0; k < 3; k++) sun[k] = ce * (Math.cos(a) * E1[k] + Math.sin(a) * E2[k]) + se * P[k];
  sunVis = smooth(clamp((sun[2] + 0.72) / 0.16, 0, 1));
}

// ring profile: opacity and colour against radius
const ringOp = new Float32Array(RN), ringR = new Float32Array(RN), ringG = new Float32Array(RN), ringB = new Float32Array(RN);
// cloud belts: colour against latitude, and how fast each belt drifts
const BT = new Uint8Array(256 * 3);
const bandSpeed = new Float32Array(NB);
const STORM_SL = 0.12;
let stormBand = 0, storm0 = 0;

function buildPlanet() {
  const rnd = mulberry(SEED);
  for (let i = 0; i < RN; i++) {
    const r = RMIN + (i + 0.5) / RK;
    ringOp[i] = 0;
    RINGS.forEach((g, k) => {
      if (r <= g[0] || r >= g[1]) return;
      const edge = clamp(Math.min(r - g[0], g[1] - r) / 0.012, 0, 1);
      let fine = 0.7 + 0.3 * noise1(r * 55, SEED + k);
      if (noise1(r * 23, SEED + 40 + k) < 0.16) fine *= 0.6;         // thin gaps inside a ring
      ringOp[i] = g[2] * edge * fine;
      const tone = 0.86 + 0.14 * noise1(r * 31, SEED + 80 + k);
      ringR[i] = g[3][0] * tone; ringG[i] = g[3][1] * tone; ringB[i] = g[3][2] * tone;
    });
  }
  const cols = [];
  let last = -1;
  for (let j = 0; j <= NB; j++) {
    let c;
    do c = (rnd() * BANDS.length) | 0; while (c === last);
    last = c;
    cols.push(j === 0 || j === NB ? POLE : j === 1 || j === NB - 1 ? [84, 132, 168] : BANDS[c]);
  }
  for (let i = 0; i < 256; i++) {
    const f = (i / 255) * NB + 0.5, c = Math.min(NB, f | 0), g = f - c;
    let a = cols[c], b = a, t = 0;
    if (g < 0.16 && c > 0) { b = cols[c - 1]; t = 0.5 - 0.5 * (g / 0.16); }
    else if (g > 0.84 && c < NB) { b = cols[c + 1]; t = 0.5 * ((g - 0.84) / 0.16); }
    for (let k = 0; k < 3; k++) BT[i * 3 + k] = lerp(a[k], b[k], t);
  }
  for (let j = 0; j < NB; j++) bandSpeed[j] = SPIN * (0.75 + 0.5 * rnd());
  stormBand = Math.min(NB - 1, ((STORM_SL * 0.5 + 0.5) * NB) | 0);
  storm0 = rnd() * TAU;
}

// ---------- stars ----------
const stars = [];
function buildStars() {
  const rnd = mulberry(SEED + 5);
  stars.length = 0;
  for (let i = 0, n = Math.round((W * H) / 2300); i < n; i++)
    stars.push({ x: rnd() * W, y: rnd() * H, b: 0.22 + 0.78 * Math.pow(rnd(), 2.6), ph: rnd() * TAU, f: 0.6 + 2.4 * rnd(), tint: rnd() });
}
function stepStars(dt) {
  const v = (W / ORBIT) * 2.2;                                    // the far sky slides by as we go around
  for (const s of stars) {
    s.x -= E1[0] * v * dt; s.y -= E1[1] * v * dt;
    if (s.x < 0) s.x += W; else if (s.x >= W) s.x -= W;
    if (s.y < 0) s.y += H; else if (s.y >= H) s.y -= H;
  }
}

// ---------- the depot ----------
// A fixed three-quarter view, the kind where one step along the station is
// three cells across and one down, so every edge is a clean staircase. The
// station's x runs down to the right, y down to the left, z straight up, and
// we only ever see the +x, +y and top faces of anything.
//
// Surfaces are sampled point by point into a depth buffer six times finer
// than the cell grid. The concrete never moves, so it is sampled once and
// kept; trucks, cranes and cargo are added on top every frame.
const AMB = 0.12;
const NRM = [[0.7071, 0.3536, 0.6124], [-0.7071, 0.3536, 0.6124], [0, -0.866, 0.5]];   // the three faces, in camera space
const FACE_TONE = [0.34, 0.6, 0.92];      // right face, left face, top: the three never merge, wherever the sun is
const lumF = [1, 1, 1];
let gs = 1, OXc = 0, OYc = 0;             // scale, and where the station's origin sits (in cells)
let SW = 0, SH = 0, stp = 0.1;
let SZ, SCOL, SGL, SPR, SN;               // this frame
let KZ, KCOL, KGL, KPR, KN;               // the kept, static station
let BZ, BCOL, BGL, BPR, BN;               // whichever of the two is being written
let mr = 0, mg = 0, mb = 0, mprio = 1, memit = false, mgl = 32;
let mkeep = 0;                            // 8 while drawing things the red alert must not dim
let epoch = -1;

const EXT = { l: -58, r: 80, t: -28, b: 47 };   // how far the depot reaches from its origin, in steps
function layoutStation(R) {
  gs = clamp(Math.min((R.cols * 0.72) / (EXT.r - EXT.l), (R.rows - 4) / (EXT.b - EXT.t)), 0.4, 2.2);
  OXc = Math.round(R.cols - 2 - EXT.r * gs);
  OYc = Math.round(2 - EXT.t * gs + (R.rows - 4 - (EXT.b - EXT.t) * gs) / 2);
  SW = R.cols * 2; SH = R.rows * 3; stp = 0.105 / gs;
  const n = SW * SH;
  SZ = new Float32Array(n); SCOL = new Uint32Array(n); SGL = new Uint16Array(n); SPR = new Uint8Array(n); SN = new Uint8Array(n);
  KZ = new Float32Array(n); KCOL = new Uint32Array(n); KGL = new Uint16Array(n); KPR = new Uint8Array(n); KN = new Uint8Array(n);
  epoch = -1;
}
// station coordinates to screen pixels
const PT = [0, 0, 0];
function project(x, y, z) {
  PT[0] = (OXc + (x - y) * 3 * gs) * renderer.cw;
  PT[1] = (OYc + (x + y) * gs - z * 2.5 * gs) * renderer.ch;
  PT[2] = 0.6124 * (x + y) + 0.5 * z;
  return PT;
}
function emit(x, y, z, n) {
  const sx = (OXc + (x - y) * 3 * gs) * 2, sy = (OYc + (x + y) * gs - z * 2.5 * gs) * 3;
  if (sx < 0 || sy < 0 || sx >= SW || sy >= SH) return;
  const k = (sy | 0) * SW + (sx | 0), d = 0.6124 * (x + y) + 0.5 * z;
  if (d <= BZ[k]) return;
  BZ[k] = d; BCOL[k] = pack(mr, mg, mb); BGL[k] = mgl; BPR[k] = mprio; BN[k] = (memit ? 3 : n) | mkeep;
}
// A box, textured by `tex(face, u, v)`: face 0 is +x (u = y, v = z), face 1 is
// +y (u = x, v = z), face 2 is the top (u = x, v = y), all in station coordinates.
function gBox(x0, y0, z0, x1, y1, z1, tex) {
  const s = stp, h = s / 2;
  // walls catch a little extra light along their top edge, which keeps every block's outline crisp
  const lip = z1 - Math.min(0.3, (z1 - z0) * 0.25) / gs;
  const edge = () => { if (!memit) { mr *= 1.22; mg *= 1.22; mb *= 1.22; } };
  for (let y = y0 + h; y < y1; y += s) for (let z = z0 + h; z < z1; z += s) { tex(0, y, z); if (z > lip) edge(); emit(x1, y, z, 0); }
  for (let x = x0 + h; x < x1; x += s) for (let z = z0 + h; z < z1; z += s) { tex(1, x, z); if (z > lip) edge(); emit(x, y1, z, 1); }
  for (let x = x0 + h; x < x1; x += s) for (let y = y0 + h; y < y1; y += s) { tex(2, x, y); emit(x, y, z1, 2); }
}
// an upright line too thin to have faces: a cable, a mast
function gPole(x, y, z0, z1, col) {
  mr = col[0]; mg = col[1]; mb = col[2]; mprio = 0; memit = false; mgl = 124;
  for (let z = z0; z < z1; z += stp) emit(x, y, z, 1);
}
const set = (c, k, prio, gl, em) => { mr = c[0] * k; mg = c[1] * k; mb = c[2] * k; mprio = prio; mgl = gl; memit = em; };
const flat = (c, k = 1) => (f) => set(c, f === 2 ? k * 1.04 : k, 1, 32, false);

// --- concrete and what is cut into or painted on it ---
function conc(tone, seed, over) {
  return (f, u, v) => {
    if (over) for (const o of over) if (o(f, u, v)) return;
    const ph = f === 2 ? 2.5 : 1.25, pu = Math.floor(u / 2.5), pv = Math.floor(v / ph);
    let k = tone * (0.95 + 0.08 * hash(pu, pv, seed + f * 7));      // each pour of the formwork a slightly different grey
    const fu = u / 2.5 - pu, fv = v / ph - pv;
    if (f !== 2) {
      k *= 0.95 + 0.07 * noise1(u * 1.3 + seed, seed);              // weather streaks down the walls
      if (fu < 0.045) return set(CONC, k * 0.74, 2, 124, false);   // the joint between pours
      if (Math.abs(fu - 0.5) < 0.05 && Math.abs(fv - 0.5) < 0.1) return set(CONC, k, 2, 46, false);   // tie holes
    } else if (fu < 0.04 || fv < 0.04) k *= 0.9;
    set(CONC, k, 1, 32, false);
  };
}
// rows of slit windows
const slits = (face, u0, u1, v0, dv, rows, seed) => (f, u, v) => {
  if (f !== face || u < u0 || u > u1) return false;
  const r = Math.floor((v - v0) / dv);
  if (r < 0 || r >= rows || v - v0 - r * dv > 0.42) return false;
  const c = Math.floor(u);
  if (u - c > 0.36) return false;
  // each window is re-rolled every couple of minutes, not all at once
  if (hash(c * 57 + r, Math.floor((epoch + hash(c, r, seed + 1) * 6) / 6), seed) < 0.5) set(WINDOW, 1, 3, 32, true);
  else set(GLASS, 1, 3, 32, false);
  return true;
};
// one long strip of glass with mullions
const ribbon = (face, u0, u1, v0, v1) => (f, u, v) => {
  if (f !== face || u < u0 || u > u1 || v < v0 || v > v1) return false;
  if (u - Math.floor(u) < 0.12) set(GLASS, 0.7, 3, 32, false); else set(RIBBON, 0.82 + 0.18 * hash(Math.floor(u), face, 9), 3, 32, true);
  return true;
};
// a cargo bay: a dark mouth in the wall with light coming up from inside
const bay = (u0, u1, v0, v1) => (f, u, v) => {
  if (f !== 1 || u < u0 - 0.3 || u > u1 + 0.3 || v < v0 || v > v1 + 0.3) return false;
  if (u < u0 || u > u1 || v > v1) { set(HAZARD_DARK, 1.5, 3, 32, false); return true; }
  const k = Math.pow(1 - (v - v0) / (v1 - v0), 1.5), rib = u - Math.floor(u / 2) * 2 < 0.16 ? 0.5 : 1;
  set(BAYGLOW, (0.07 + 0.5 * k) * rib, 3, 32, true);
  return true;
};
const DIGITS = ["111101101101111", "010110010010111", "111001111100111", "111001111001111", "101101111001001", "111100111001111", "111100111101111", "111001010010010", "111101111101111", "111101111001111"];
// stencilled numbers; on a +x face the text has to run toward smaller u to read left to right
const stencil = (face, text, u0, v0, tw, th) => (f, u, v) => {
  if (f !== face) return false;
  const cu = Math.floor((face === 0 ? u0 - u : u - u0) / tw), cv = Math.floor((v0 - v) / th);
  if (cv < 0 || cv > 4 || cu < 0) return false;
  const ch = Math.floor(cu / 4), col = cu - ch * 4;
  if (ch >= text.length || col > 2) return false;
  if (DIGITS[+text[ch]][cv * 3 + col] !== "1") return false;
  set(PAINT, 0.9, 3, 32, true);                                    // lit signage, so it reads in shadow too
  return true;
};
// the quay's deck: crane rails and a striped edge
const quayDeck = (f, u, v) => {
  if (f !== 2) return false;
  if (v > QUAY_Y1 - 0.4) { if (Math.floor(u / 1.2) & 1) set(HAZARD, 0.95, 2, 32, false); else set(HAZARD_DARK, 1, 2, 32, false); return true; }
  if (Math.abs(v - RAIL[0]) < 0.1 || Math.abs(v - RAIL[1]) < 0.1) { set(STEEL, 0.55, 2, 61, false); return true; }
  return false;
};

// a radiator fin: a dark slab with rows of heat pipes glowing through it
const radiator = (f, u, v) => {
  if (f !== 1) return set(STEEL, 0.5, 1, 32, false);
  const q = v / 1.7 - Math.floor(v / 1.7), su = Math.abs(u + 5) % 3.6;
  if (q > 0.5 || su < 0.22) return set(STEEL, 0.34, 2, 32, false);       // the frame between the pipes
  const heat = clamp((u + 8.8) / 7.6, 0, 1);                             // hottest where the coolant comes in
  set(RADIATOR, 0.16 + 0.42 * heat * heat + 0.05 * noise1(u * 1.4, 17), 3, 32, true);
};
// the engine block's end: three square nozzles with a pilot glow deep inside
const NOZ_Y = [3.3, 5.5, 7.7], NOZ_Z = -1.6;
const nozzles = (f, u, v) => {
  if (f !== 0) return false;
  for (const y of NOZ_Y) {
    const d = Math.max(Math.abs(u - y), Math.abs(v - NOZ_Z));
    if (d > 0.85) continue;
    if (d > 0.55) set(STEEL, 0.5, 3, 32, false); else set(NOZZLE, 0.16 + 0.5 * (1 - d / 0.55), 3, 32, true);
    return true;
  }
  return false;
};

function buildStatic() {
  BZ = KZ; BCOL = KCOL; BGL = KGL; BPR = KPR; BN = KN;
  KZ.fill(-1e9);
  // the keel hanging underneath
  gBox(3, 1, -2, 23, 11, 0, conc(0.7, 3, [slits(1, 5, 21, -1.5, 1.2, 1, 71)]));
  // more of the station hangs below it than a building ever could: a second
  // tower pointing down, stepping in to a mast
  gBox(12.5, 3, -6.5, 19.5, 9, -2, conc(0.84, 51, [slits(1, 13, 19, -5.9, 1.25, 3, 73), slits(0, 3.5, 8.5, -5.9, 1.25, 3, 75)]));
  gBox(14.5, 4.5, -8, 17.5, 7.5, -6.5, conc(0.72, 53));
  gPole(16, 6, -10, -8, STEEL);
  gPole(5, 10.6, -4.2, -2, STEEL);
  gPole(8.5, 10.6, -3.4, -2, STEEL);
  // the engine block at the end of the keel
  gBox(23, 2, -3.2, 26.6, 9, 0, conc(0.66, 55, [nozzles]));
  // radiator fins out on a boom, well away from the crew
  gBox(-9.4, 3.6, 3.3, 0, 4.3, 3.9, flat(STEEL, 0.6));
  gBox(-8.8, 2.1, -0.6, -1.2, 2.45, 7.6, radiator);
  gBox(-8.8, 5.5, -0.6, -1.2, 5.85, 7.6, radiator);
  // the long back wall
  gBox(0, -1.5, 0, 26, 0, 8.6, conc(0.8, 11));
  // the main slab: cargo bays on the quay side, the depot's number on its end
  gBox(0, 0, 0, 26, 8, 6.5, conc(1, 5, [
    bay(1.6, 11, 1.5, 4.2), bay(15.1, 24.5, 1.5, 4.2),
    stencil(1, "01", 4.4, 6.35, 0.5, 0.38), stencil(1, "02", 17.9, 6.35, 0.5, 0.38),
    stencil(0, "07", 7.2, 5.6, 0.5, 0.75), slits(0, 0.6, 3, 1.4, 1.3, 4, 21),

            if (z < zmax - 0.3) continue;
            const p = SPR[k];
            if (p > bp || (p === bp && z > bz)) { best = k; bp = p; bz = z; }
          }
        const i = r * cols + c, col = SCOL[best], nf = SN[best] & 7;
        let k = nf < 3 ? lumF[nf] : 1, red = 0;
        if (al > 0) {
          // On red alert the depot dims. The gun sits in a soft pool of light
          // that swells as it charges, and each alarm beacon throws a turning
          // beam of orange over whatever is near it.
          const gd = Math.hypot((c - gcx) * cw, (r - gcy) * ch) / spotR, spot = Math.exp(-gd * gd);
          if (SN[best] & 8) k *= 1 + 0.12 * al * spot;
          else {
            k *= lerp(1, lerp(nf === 3 ? 0.72 : 0.55, 1.15, spot), al);
            let sum = 0;
            for (let q = 0; q < ALARMS.length; q++) {
              const dx = (c + 0.5) * cw - ALARM_PX[q * 2], dy = (r + 0.5) * ch - ALARM_PX[q * 2 + 1], dd = dx * dx + dy * dy;
              if (dd >= alarmR2) continue;
              const f = 1 - dd / alarmR2, a = time * 4.2 + ALARMS[q][3];
              const lobe = dd < 9 ? 1 : (dx * Math.cos(a) + dy * Math.sin(a)) / Math.sqrt(dd);
              sum += f * f * (0.22 + 0.78 * lobe * lobe * lobe * lobe);
            }
            red = al * Math.min(1, sum) * (1 - spot) * 95;
          }
        }
        const cr = (col >>> 16) * k + red, cg = ((col >>> 8) & 255) * k + red * 0.42, cb = (col & 255) * k;
        if (bp === 0) this.bare(i, SGL[best], pack(cr, cg, cb));
        else if (n >= 3) {
          const ink = nf === 3 ? 0.72 : 0.6;
          flag[i] = 1; fill[i] = pack(cr, cg, cb); glyph[i] = SGL[best];
          colour[i] = pack(cr * ink, cg * ink, cb * ink);
        }
      }
  },

  // a lamp somewhere on the depot, hidden when something is in front of it
  lamp(x, y, z, col, on) {
    if (!on) return;
    const p = project(x, y, z), sx = (p[0] / this.cw * 2) | 0, sy = (p[1] / this.ch * 3) | 0;
    if (p[0] < 0 || p[1] < 0 || sx >= SW || sy >= SH) return;
    if (SZ[sy * SW + sx] > p[2] + 0.35) return;
    const i = this.cellIndex(p[0], p[1]);
    if (i < 0) return;
    this.bare(i, 42, pack(col[0], col[1], col[2]));
  },

  drawDepot() {
    const ep = Math.floor(time / 20);
    if (ep !== epoch) { epoch = ep; buildStatic(); }                // a few windows change every so often
    SZ.set(KZ); SCOL.set(KCOL); SGL.set(KGL); SPR.set(KPR); SN.set(KN);
    buildMoving();
    for (let k = 0; k < 3; k++) {
      const d = NRM[k][0] * sun[0] + NRM[k][1] * sun[1] + NRM[k][2] * sun[2];
      lumF[k] = (0.22 + 0.78 * sunVis) * (FACE_TONE[k] * 0.78 + (d > 0 ? d * 0.3 : 0));
    }
    this.resolve();
    const t = time, RED = [255, 60, 52], AMBER = [255, 190, 80], WHITE = [255, 255, 255];
    const alarm = raid.pirates.some((q) => !q.dead);                          // the mast beacons go frantic during a raid
    this.lamp(8.5, 1.5, 14.8, RED, alarm ? t % 0.36 < 0.18 : t % 2 < 1);
    this.lamp(3.3, 5.6, 13.5, RED, alarm ? (t + 0.18) % 0.36 < 0.18 : (t + 1) % 2 < 1);
    this.lamp(16, 6, -10.1, RED, (t + 0.5) % 2 < 1);
    if (raid.alert > 0.3) for (const q of ALARMS) this.lamp(q[0], q[1], q[2], [255, 170, 60], true);
    this.lamp(5, 10.6, -4.3, AMBER, t % 3 < 0.3);
    this.lamp(-9.4, 4, 4, RED, (t + 1.3) % 2 < 1);
    // buoys along the approach lane wink in turn, leading trucks in
    for (let k = 0; k < BUOYS.length; k++) this.lamp(BUOYS[k][0] + 0.25, BUOYS[k][1] + 0.25, BUOYS[k][2] + 0.6, [90, 255, 150], (t * 1.5 + k) % 3 < 0.5);
    if (burn.on > 0) for (const y of NOZ_Y) this.lamp(26.65, y, NOZ_Z, [235, 245, 255], true);
    this.lamp(24, 4, 13.7, WHITE, t % 2.4 < 0.1 || (t % 2.4 > 0.25 && t % 2.4 < 0.35));
    for (let b = 0; b < 2; b++) {
      const tr = trucks[b], c = cranes[b];
      // lights run along the quay edge toward a berth that has a truck coming in
      if (tr.mode === "arrive" || tr.mode === "in")
        for (let k = 0; k < 7; k++) this.lamp(BERTH_X[b] + 0.4 + k * 1.7, QUAY_Y1 - 0.15, 1.55, AMBER, (k + Math.floor(t * 5)) % 7 < 2);
      this.lamp(c.x, BERTH_Y + TW + 0.4, BEAM_Z + 0.55, AMBER, c.moving && t % 0.7 < 0.35);
      if (tr.mode !== "away") {
        this.lamp(tr.x + TRUCK_LEN - 0.6, tr.y + TW / 2, tr.z + 1.6, AMBER, tr.mode !== "docked" && t % 1 < 0.5);
        this.lamp(tr.x + 0.2, tr.y + TW, tr.z + 1.35, RED, true);
      }
    }
  },

  // tint a cell toward a colour and optionally put a glyph on it
  glow(i, col, k, gl, ink) {
    const f = this.flag[i] && this.fill[i] ? this.fill[i] : pack(BG[0], BG[1], BG[2]);
    this.flag[i] = 1;
    this.fill[i] = pack(lerp(f >>> 16, col[0], k), lerp((f >>> 8) & 255, col[1], k), lerp(f & 255, col[2], k));
    if (gl) { this.glyph[i] = gl; this.colour[i] = ink; } else if (this.glyph[i] === 0) this.glyph[i] = 32;
  },
  drawRaid() {
    const { cw, ch, cols, rows } = this, r = raid;
    // The shield, only where it has just been hit: a small bright patch and one
    // thin ring running outward over the surface. Anything nearer to us than
    // the shield at that spot (a raider, say) stays in front of it.
    for (const h of r.hits) {
      const p = project(h.x, h.y, h.z), c0 = Math.floor(p[0] / cw), r0 = Math.floor(p[1] / ch);
      const RC = Math.ceil(13 * gs), RR = Math.ceil(9 * gs), u = h.t / HIT_LIFE, ring = 0.9 + 3.2 * Math.sqrt(u);
      const fade = u < 0.5 ? 1 : u < 0.78 ? 0.6 : 0.3;                // stepped, so it switches off rather than smears
      for (let rr = Math.max(0, r0 - RR); rr <= Math.min(rows - 1, r0 + RR); rr++)
        for (let c = Math.max(0, c0 - RC); c <= Math.min(cols - 1, c0 + RC); c++) {
          // where this cell's line of sight meets the shield, on the side facing us
          const a = (c + 0.5 - OXc) / (3 * gs), b = (rr + 0.5 - OYc) / gs;
          const ox = ((a + b) / 2 - SH_C[0]) / SH_R[0], oy = ((b - a) / 2 - SH_C[1]) / SH_R[1], oz = -SH_C[2] / SH_R[2];
          const dx = 1 / SH_R[0], dy = 1 / SH_R[1], dz = 0.8 / SH_R[2];
          const A = dx * dx + dy * dy + dz * dz, B = 2 * (ox * dx + oy * dy + oz * dz), C = ox * ox + oy * oy + oz * oz - 1;
          const disc = B * B - 4 * A * C;
          if (disc < 0) continue;
          const s = (-B + Math.sqrt(disc)) / (2 * A), X = (a + b) / 2 + s, Y = (b - a) / 2 + s, Z = 0.8 * s;
          const d = Math.hypot(X - h.x, Y - h.y, Z - h.z), core = d < 1.25 * (1 - u * 0.6), edge = Math.abs(d - ring) < 0.32;
          if (!core && !edge) continue;
          const k = (rr * 3 + 1) * SW + c * 2;
          if (Math.max(SZ[k], SZ[k + 1]) > 0.6124 * (X + Y) + 0.5 * Z + 0.3) continue;
          const i = rr * cols + c;
          if (core) this.glow(i, d < 0.55 ? [200, 232, 255] : SHIELD, 0.85 * fade, 0, 0);
          else this.glow(i, SHIELD, 0.5 * fade, 0, 0);
        }
    }
    // shots in flight
    for (const b of r.bolts) {
      const pa = project(b.from[0], b.from[1], b.from[2]), ax = pa[0], ay = pa[1], pb = project(b.to[0], b.to[1], b.to[2]);
      const gl = dirGlyph(Math.atan2(pb[1] - ay, pb[0] - ax));
      for (let k = 0; k < 4; k++) {
        const u = b.t / b.dur - k * 0.035;
        if (u < 0) break;
        const i = this.cellIndex(lerp(ax, pb[0], u), lerp(ay, pb[1], u));
        if (i >= 0) this.bare(i, k ? gl : 42, k ? pack(255 - k * 40, 70, 50) : pack(255, 190, 150));
      }
    }
    const m = project(...muzzle(MZ)), mx = m[0], my = m[1];
    // the gun gathering its charge
    if (r.target && r.charge > 0) {
      const rad = (0.8 + 2.4 * r.charge) * cw * (0.9 + 0.1 * Math.sin(time * 40));
      for (let y = my - rad; y <= my + rad; y += ch) for (let x = mx - rad * 1.2; x <= mx + rad * 1.2; x += cw) {
        const d = Math.hypot((x - mx) / 1.2, y - my) / rad, i = this.cellIndex(x, y);
        if (d < 1 && i >= 0) this.glow(i, [190, 240, 255], (1 - d) * (0.4 + 0.6 * r.charge), d < 0.35 ? 42 : 0, pack(255, 255, 255));
      }
    }
    // and letting it go
    if (r.beam > 0) {
      const e = project(r.beamTo[0], r.beamTo[1], r.beamTo[2]), k = r.beam / 0.4, n = Math.ceil(Math.hypot(e[0] - mx, e[1] - my) / (cw * 0.5));
      const gl = dirGlyph(Math.atan2(e[1] - my, e[0] - mx));
      for (let j = 0; j <= n; j++) {
        const x = lerp(mx, e[0], j / n), y = lerp(my, e[1], j / n), i = this.cellIndex(x, y);
        if (i < 0) continue;
        this.glow(i, [225, 248, 255], 0.3 + 0.7 * k, gl, pack(255, 255, 255));
        const i2 = this.cellIndex(x, y + ch);
        if (i2 >= 0 && k > 0.5) this.glow(i2, [120, 200, 255], 0.35 * k, 0, 0);
      }
    }
    for (const b of r.booms) {
      const p = project(b.x, b.y, b.z), px = p[0], py = p[1], u = b.t / 0.8, rad = (2 + 5 * Math.sqrt(u)) * cw;
      for (let y = py - rad; y <= py + rad; y += ch) for (let x = px - rad; x <= px + rad; x += cw) {
        const d = Math.hypot(x - px, y - py) / rad, i = this.cellIndex(x, y);
        if (i < 0 || d > 1) continue;
        if (u < 0.55 && d < 0.75) {                                  // the fireball: white at the heart, orange outside
          const k = Math.min(1, (1 - d / 0.75) * 2.2) * (1 - u / 0.55), core = d < 0.3 + 0.2 * (1 - u);
          this.glow(i, core ? [255, 244, 210] : [255, 132, 40], k, core ? 42 : hash(x | 0, y | 0, 5) < 0.4 ? 43 : 0, pack(255, 255, 230));
        } else if (d > 0.82 && hash(x | 0, y | 0, 7) < 0.6) this.bare(i, d > 0.92 ? 46 : 43, pack(255 * (1 - u) + 60, 150 * (1 - u) + 30, 40));
      }
    }
  },

  drawSparks() {
    for (const p of sparks) {
      const i = this.cellIndex(p.x, p.y);
      if (i < 0) continue;
      const u = p.t / p.life, k = 1 - u * 0.75;
      const col = p.col ? pack(p.col[0] * k, p.col[1] * k, p.col[2] * k) : p.hot ? pack(lerp(255, 110, u) * k, lerp(240, 160, u) * k, lerp(210, 255, u) * k) : pack(214 * k, 230 * k, 255 * k);
      this.bare(i, u < 0.3 ? 42 : u < 0.65 ? 43 : 46, col);
    }
  },

  render() {
    const { ctx, dpr, cols, cw, ch } = this;
    this.flag.fill(0);
    this.drawStars();
    this.drawPlanet();
    this.drawMoons();
    this.drawDepot();
    this.drawRaid();
    this.drawSparks();

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = `rgb(${BG})`;
    ctx.fillRect(0, 0, W, H);

    // one character per occupied cell
    ctx.font = `600 ${Math.round(ch * 0.78)}px ${this.font}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    let lastStyle = "";
    for (let i = 0; i < this.flag.length; i++) {
      if (!this.flag[i]) continue;
      const x = (i % cols) * cw, y = ((i / cols) | 0) * ch;
      if (this.fill[i]) {
        const fs = css(this.fill[i]);
        if (fs !== lastStyle) ctx.fillStyle = lastStyle = fs;
        ctx.fillRect(x + 1, y + 1, cw - 1, ch - 1);
      }
      const g = this.glyph[i];
      if (g === 32) continue;
      const gs2 = css(this.colour[i]);
      if (gs2 !== lastStyle) ctx.fillStyle = lastStyle = gs2;
      ctx.fillText(String.fromCharCode(g), x + cw / 2, y + ch / 2 + ch * 0.06);
    }
  },
};

// ---------- boot ----------
const canvas = document.querySelector("canvas");
renderer.canvas = canvas;
renderer.ctx = canvas.getContext("2d", { alpha: false });
renderer.font = getComputedStyle(canvas).fontFamily || "monospace";
buildPlanet();
buildWorld();

function tick(dt) {
  time += dt;
  stepSun();
  stepStars(dt);
  stepDepot(dt);
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  if (w < 1 || h < 1) return;
  W = w; H = h;
  renderer.resize(w, h, Math.min(window.devicePixelRatio || 1, 2));
  buildStars();
  sparks.length = 0;
  stepSun();
  renderer.render();
}

// Frames drawn per second; override with ?fps=20 etc.
const FPS = clamp(Number(params.get("fps")) || 30, 5, 120);
const still = window.matchMedia("(prefers-reduced-motion: reduce)");
let last = 0;

function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 1000 / FPS - 2) return;                         // not time for the next frame yet
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  tick(dt);
  renderer.render();
}

window.addEventListener("resize", resize);
resize();
// ?t=20 starts the scene 20 seconds in
for (let i = 0, n = Math.round((Number(params.get("t")) || 0) * 30); i < n; i++) tick(1 / 30);
renderer.render();
if (!still.matches) {
  last = performance.now();
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
